          - {name: Black Forest Labs, ar: بلاك فورست لابز, aliases: [FLUX], hf: black-forest-labs}
          - {name: Kyutai, ar: كيوتاي, aliases: [Moshi], hf: kyutai}
          - {name: DeepL, ar: ديب إل}
      cn:
        label_ar: الصين
        entities:
          - {name: DeepSeek, ar: ديب سيك, hf: deepseek-ai, github: deepseek-ai/DeepSeek-V3, x: deepseek_ai}
          - {name: Alibaba Qwen, ar: علي بابا كوين, aliases: [Qwen, Alibaba Cloud AI, Tongyi], hf: Qwen, x: Alibaba_Qwen}
          - {name: Moonshot AI, ar: مونشوت, aliases: [Kimi], hf: moonshotai}
          - {name: Zhipu AI, ar: جيبو, aliases: [GLM, Z.ai, ChatGLM], hf: zai-org}
          - {name: ByteDance Seed, ar: بايت دانس, aliases: [Doubao, Seed, ByteDance AI], hf: ByteDance-Seed}
          - {name: Baidu ERNIE, ar: بايدو, aliases: [ERNIE, Baidu AI], hf: baidu}
          - {name: Tencent Hunyuan, ar: تينسنت, aliases: [Hunyuan], hf: tencent}
          - {name: MiniMax, ar: ميني ماكس, hf: MiniMaxAI}
          - {name: StepFun, ar: ستيب فن, aliases: [Step-3, Juejue Xingchen, 阶跃星辰], hf: stepfun-ai}
      gulf:
        label_ar: الخليج والعالم العربي
        weight: 1.3
        entities:
          - {name: G42, ar: جي 42, aliases: [Core42, Jais, Inception AI, MGX], hf: inceptionai, x: G42ai}
          - {name: TII, ar: معهد الابتكار التكنولوجي, aliases: [Technology Innovation Institute, Falcon], hf: tiiuae, x: TIIuae}
          - {name: Humain, ar: هيومين, aliases: [HUMAIN, PIF AI], x: HUMAINAI}
          - {name: SDAIA, ar: سدايا, aliases: [ALLaM, Saudi Data and AI Authority], x: SDAIA_SA}
