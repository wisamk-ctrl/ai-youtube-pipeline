# ─────────────────────────────────────────────────────────────────────
# The watchlist: names we follow on purpose. Edit freely; it is read on every run.
#
# tracks   → models | agents | chips   (the three beats of the episode)
# groups   → regions for models, categories for agents/chips
# entity:
#   name      canonical English name (used in prompts and the radar state)
#   ar        Arabic name as it should be spoken in the script
#   aliases   other spellings the matcher should recognise (case-insensitive, whole-word)
#   query     Google News search; defaults to the name. Put quotes around multi-word names.
#   rss       official blog / newsroom feeds
#   github    owner/repo whose releases are news
#   hf        Hugging Face organisation (new models = news)
#   x         X handle (used when the X source is enabled)
#   weight    multiplies the relevance score (1.0 = normal; the Gulf gets 1.3 by policy)
# ─────────────────────────────────────────────────────────────────────

tracks:
  models:
    label_ar: النماذج والمختبرات
    groups:
      us:
        label_ar: الولايات المتحدة
        entities:
          - {name: OpenAI, ar: أوبن إيه آي, aliases: [GPT, ChatGPT, Codex, Sora], rss: [https://openai.com/news/rss.xml], hf: openai, x: OpenAI}
          - {name: Anthropic, ar: أنثروبيك, aliases: [Claude], x: AnthropicAI}
          - {name: Google DeepMind, ar: جوجل ديب مايند, aliases: [Gemini, DeepMind, Google AI, Gemma], rss: [https://blog.google/technology/ai/rss/, https://deepmind.google/blog/rss.xml], hf: google, x: GoogleDeepMind}
          - {name: Microsoft Copilot, ar: مايكروسوفت كوبايلوت, aliases: [Copilot, Phi, Azure AI], hf: microsoft, x: Microsoft}
          - {name: Meta AI, ar: ميتا, aliases: [Llama, Meta Superintelligence], hf: meta-llama, x: AIatMeta}
          - {name: xAI, ar: إكس إيه آي, aliases: [Grok], x: xai}
          - {name: Amazon Nova, ar: أمازون, aliases: [Amazon Bedrock, AWS AI, Nova], rss: [https://aws.amazon.com/blogs/machine-learning/feed/]}
          - {name: Apple Intelligence, ar: آبل, aliases: [Apple AI, Apple Foundation Models], rss: [https://machinelearning.apple.com/rss.xml]}
      eu:
        label_ar: أوروبا
        entities:
          - {name: Mistral, ar: ميسترال, aliases: [Mistral AI, Mistral Large, Codestral, Le Chat], rss: [https://mistral.ai/news/rss], hf: mistralai, x: MistralAI}
