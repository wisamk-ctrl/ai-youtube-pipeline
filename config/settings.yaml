# ─────────────────────────────────────────────────────────────────────
# Pipeline configuration. Secrets live in .env, never here.
# ─────────────────────────────────────────────────────────────────────

ingestion:
  lookback_days: 7            # weekly roundup window
  request_timeout_s: 20

  # RSS feeds. Verify each URL before the first run: newsletters move their
  # feeds, and some (e.g. AlphaSignal) publish only by email. For an email-only
  # newsletter, forward it to a service such as Kill the Newsletter
  # (kill-the-newsletter.com), which gives you an Atom feed URL to paste here.
  rss_feeds:
    - name: TLDR AI
      url: https://tldr.tech/api/rss/ai
      weight: 1.2               # source credibility multiplier used in scoring
    - name: AlphaSignal
      url: ""                   # paste your kill-the-newsletter Atom URL here
      weight: 1.2
    - name: Import AI
      url: https://jack-clark.net/feed/   # the author's own feed: Substack's answers 403 to GitHub runners (2026-11-19)
      weight: 1.1
    # The Batch (DeepLearning.AI): every deeplearning.ai URL answers 403 to GitHub runners (2026-11-19), so it is
    # read as a Google News site search below.
    # Regional tech and business outlets (founder 2026-11-22: more local coverage). Feeds checked 2026-11-22.
    # They publish far more than AI, so `ai_only: true` passes only their AI stories (pipeline/ingestion/ai_filter.py);
    # `region` feeds the regional seats in scoring. Tiers are in config/publishers.yaml.
    - {name: Arabian Business,  url: "https://www.arabianbusiness.com/feed",       region: gulf,   ai_only: true}
    - {name: ITP.net,           url: "https://www.itp.net/feed",                   region: gulf,   ai_only: true}
    - {name: Gulf News,         url: "https://gulfnews.com/feed",                  region: gulf,   ai_only: true}   # latest 12 only: the news watch catches the rest
    - {name: Saudi Gazette,     url: "https://saudigazette.com.sa/rssFeed/0",      region: gulf,   ai_only: true}
    - {name: Asharq Al-Awsat,   url: "https://aawsat.com/feed",                    region: gulf,   ai_only: true}   # Arabic
    - {name: Asharq Al-Awsat English, url: "https://english.aawsat.com/feed",      region: gulf,   ai_only: true}
    - {name: AITNews,           url: "https://aitnews.com/feed/",                  region: gulf,   ai_only: true}   # Arabic, البوابة العربية للأخبار التقنية
    - {name: Roya News,         url: "https://royanews.tv/rss",                    region: levant, ai_only: true}   # Arabic, Jordan
    - {name: Jordan News,       url: "https://www.jordannews.jo/rss",              region: levant, ai_only: true}
    - {name: Egypt Independent, url: "https://www.egyptindependent.com/feed/",     region: egypt,  ai_only: true}
    - {name: Webrazzi,          url: "https://webrazzi.com/kategori/yapay-zeka/feed/", region: turkey, ai_only: true}   # Turkish, AI section

  # YouTube channels. From a home/office IP the Atom feeds work with no key; from a datacenter
  # (GitHub runners) YouTube answers 404, so set YOUTUBE_API_KEY (Data API v3, 1 quota unit per
  # channel per run) and the same list is read through the API. Give a handle (resolved
  # to a channel id on first run and cached in data/youtube_channels.json) or a channel_id.
  # Weight below 1: a video is a lead to verify against a written source, not a source itself.
  # lead_only: true → the channel feeds the radar (new names) but never reaches the script
  # as a source (review 2026-11-07: hype channels are radar leads only).
  youtube:
    enabled: true
    max_per_channel: 5
    channels:
      - { name: "Matt Wolfe",        handle: mreflow,              weight: 0.8 }
      - { name: "AI Explained",      handle: aiexplained-official, weight: 0.9 }
      - { name: "Wes Roth",          handle: WesRoth,              weight: 0.8, lead_only: true }
      - { name: "TheAIGRID",         handle: TheAIGRID,            weight: 0.7, lead_only: true }
      - { name: "Two Minute Papers", handle: TwoMinutePapers,      weight: 0.8 }
      - { name: "MattVidPro AI",     handle: MattVidPro,           weight: 0.7, lead_only: true }
      - { name: "Fireship",          handle: Fireship,             weight: 0.7 }
      - { name: "bycloud",           handle: bycloudAI,            weight: 0.7 }
      - { name: "Yannic Kilcher",    handle: YannicKilcher,        weight: 0.8 }
      - { name: "The AI Advantage",  handle: aiadvantage,          weight: 0.7, lead_only: true }

  # Newsletters that arrive by email. Needs GOOGLE_CLIENT_ID/SECRET + GMAIL_REFRESH_TOKEN
  # (scripts/google_authorize.py gmail). Each email is split into its stories.
  gmail:
    enabled: false
    newsletters:
      - name: TLDR AI (email)
        query: "from:tldr.tech subject:AI"
        weight: 1.2
      - name: AlphaSignal
        query: "from:alphasignal.ai"
        weight: 1.2
      - name: The Rundown AI
        query: "from:therundown.ai"
        weight: 1.0

  x:
    enabled: true
    top_n: 10                 # keep the 10 highest-engagement posts of the week
    max_posts_per_account: 100
    accounts:
      - emollick
      - rowancheung
      - karpathy
      - AndrewYNg
      - simonw

  # Sources driven by config/watchlist.yaml (all free, no keys)
  watchlist:
    enabled: true
    google_news: true         # one search feed per watched name
    official_feeds: true      # the names' own blogs / newsrooms
    github: true              # releases of watched repos (set GITHUB_TOKEN to lift the anonymous rate limit)
    huggingface: true         # new models from watched organisations
    max_per_entity: 8         # Google News items kept per name per week
    # Google News items carry only headline + publisher. Resolve the link to the publisher's page
    # and keep the article text (best effort; paywalls and failures keep the headline).
    fetch_articles:
      enabled: true
      max_items: 60           # page fetches per run (two requests each at most)
      timeout_s: 8
      max_chars: 2500         # same cap as RSS bodies

  # Regional outlets (Gulf + Levant), read as Google News site: searches so no feed URL has to be
  # guessed. Publisher tiers for the credit come from config/publishers.yaml.
  google_news_sites:
    - { name: The National,  query: "site:thenationalnews.com", region: gulf }
    - { name: The Batch,     query: "site:deeplearning.ai the-batch" }
    - { name: Arab News,     query: "site:arabnews.com",        region: gulf }
    - { name: WAM,           query: "site:wam.ae",              region: gulf }
    - { name: SPA,           query: "site:spa.gov.sa",          region: gulf }
    - { name: Zawya,         query: "site:zawya.com",           region: gulf }
    - { name: Wamda,         query: "site:wamda.com",           region: levant }
    - { name: MoDEE Jordan,  query: "site:modee.gov.jo",        region: levant }
    - { name: Jordan News Agency, query: "site:petra.gov.jo",   region: levant }
    # Egypt and North Africa, Turkey, Pakistan (founder decision 2026-11-15: his network there).
    # These are general outlets, so each search is narrowed to AI; a story still has to earn its
    # place (prompts.py: major news only, never a weekly quota).
    # Outages and security failures of the platforms the region runs on (founder 2026-11-17, after W46-en
    # missed the Microsoft 365 outage). `raw: true` searches without the word "AI".
    - { name: Cloud outages,        query: 'outage (Microsoft OR Azure OR AWS OR "Google Cloud" OR Cloudflare OR OpenAI OR Anthropic OR Oracle)', raw: true, max_items: 6 }
    - { name: Cloud outages Gulf,   query: 'outage (UAE OR Saudi OR Gulf OR "Middle East") (cloud OR Microsoft OR AWS OR Google)', region: gulf, raw: true, max_items: 6 }
    # Big deals that bear on AI (founder 2026-11-24, after CrowdStrike's $43.9 billion purchase of Zscaler was
    # missed: neither company is a watched name, so the big outlets' coverage never reached the watch). Searched
    # without the added "AI" word, but `always_flag: false`: a deal is flagged by the usual rule (several outlets
    # carry it), not on sight, so one stock-tip headline with "billion" in it raises no alert.
    - { name: Big deals, query: '(acquire OR acquires OR acquisition OR merger OR buyout) billion (AI OR "artificial intelligence")', raw: true, always_flag: false, max_items: 12 }
    - { name: Ahram Online,       query: 'site:english.ahram.org.eg "artificial intelligence"', region: egypt, max_items: 4 }
    - { name: Daily News Egypt,   query: 'site:dailynewsegypt.com "artificial intelligence"',   region: egypt, max_items: 4 }
    - { name: Morocco World News, query: 'site:moroccoworldnews.com "artificial intelligence"', region: north_africa, max_items: 4 }
    - { name: Daily Sabah,        query: 'site:dailysabah.com "artificial intelligence"',       region: turkey, max_items: 4 }
    - { name: Anadolu Agency,     query: 'site:aa.com.tr "artificial intelligence"',            region: turkey, max_items: 4 }
    - { name: Dawn,               query: 'site:dawn.com "artificial intelligence"',             region: pakistan, max_items: 4 }
    - { name: Business Recorder,  query: 'site:brecorder.com "artificial intelligence"',        region: pakistan, max_items: 4 }
    - { name: Enterprise Egypt,   query: 'site:enterprise.news "artificial intelligence"',      region: egypt, max_items: 4 }
    - { name: TechCabal,          query: 'site:techcabal.com "artificial intelligence" (Egypt OR Morocco OR Tunisia OR Algeria)', region: north_africa, max_items: 4 }
    - { name: Hurriyet Daily News, query: 'site:hurriyetdailynews.com "artificial intelligence"', region: turkey, max_items: 4 }
    - { name: ProPakistani,       query: 'site:propakistani.pk "artificial intelligence"',      region: pakistan, max_items: 4 }
    # Regional outlets with no usable feed (checked 2026-11-22: MAGNiTT, StartupScene and Menabytes have none at all), filtered to AI news like the regional feeds above.
    - { name: Khaleej Times,     query: "site:khaleejtimes.com", region: gulf,   ai_only: true, max_items: 6 }
    - { name: AGBI,              query: "site:agbi.com",         region: gulf,   ai_only: true, max_items: 4 }   # its feed answers 405 to our browser User-Agent (2026-11-22)
    - { name: Gulf Business,     query: "site:gulfbusiness.com", region: gulf,   ai_only: true, max_items: 4 }
    - { name: Wired Middle East, query: "site:wired.me",         region: gulf,   ai_only: true, max_items: 4 }
    - { name: Jordan Times,      query: "site:jordantimes.com",  region: levant, ai_only: true, max_items: 4 }
    - { name: Disrupt Africa,    query: "site:disruptafrica.com", region: africa, ai_only: true, max_items: 4 }

scoring:
  min_score: 2.0              # items below this are dropped as noise
  max_items: 30               # cap handed to the scripting engine
  min_per_track:              # reserved seats so every beat of the episode has material
    models: 8
    agents: 5
    chips: 4
    radar: 1
  dedupe_similarity: 0.82     # title similarity above which two items are duplicates
  # Founder 2026-11-20 (replaces the 2026-11-15 "no quota"): Africa and Türkiye each get a seat when they have
  # AI news this week (pipeline/ingestion/scoring.py REGIONS). A story an earlier episode covered is marked down.
  min_per_region: {africa: 1, turkey: 1}
  # Story size (founder 2026-11-20, after W47 left out the Anthropic IPO for 8 AWS blog posts):
  coverage_bonus: 3.0         # + this × log2(outlets carrying the story); 2 outlets +3, 16 +12, 64 (cap) +18
  max_per_source: 3           # no single feed takes more than this many seats
  max_per_story: 2            # two angles on one story at most
  flagged_seats: 3            # seats reserved for the stories the news watch flagged as big this week

ranking:
  # Story ranking for the episode and the Shorts (founder 2026-11-22; docs/plans/2026-11-22-news-ranking.md).
  # The week's scored items are grouped into stories (pipeline/ranking/cluster.py), a model gives each story
  # 0-3 per criterion with a one-line reason (judge.py), and the code applies the weights, the gates and the
  # slots (rank.py). The list is saved to data/ranking/<week>.json and posted as the "Ranking: <week>" issue.
  enabled: true
  require_approval: true      # the script waits for `/story approve` on the Ranking issue (story-decide.yml)
  # Haiku: one call a week, 15-20 stories, a short rubric and structured output, and the founder reads every
  # score and reason before the script. Raise to claude-sonnet-5-5 if the reasons read thin. With no
  # ANTHROPIC_API_KEY the stories are judged from keywords and outlet tiers and marked "keyword fallback".
  model: claude-haiku-5-5
  judge_runs: 3               # the judge is asked this many times and the middle score per criterion is kept (2026-11-23: one run's totals moved by up to 7 of 21 on a second run)
  max_stories: 20             # stories judged a week (plan: 15-20); flagged stories and region seats are kept
  items_per_story: 5          # articles kept per story for the writer, best outlet tier first, one per outlet
  weights:                    # total = sum of weight × the 0-3 score, computed in code (max 21)
    decision_impact: 3        # does it change a decision a manager makes?
    regional_consequence: 2   # 2 or 3 needs a named regional actor, rule, customer, market or supplier in the sources
    evidence: 1
    tension: 1
  # Gates, pass/fail in code: new development since the last episode (data/covered.json), carried by a tier A
  # or B outlet (config/publishers.yaml), enough to say for 60-180 s, not on the kill list. A story that fails
  # one can still be radar, except a repeat with nothing new. Generic explainers go to Shorts.
  deep:
    default: 3                # at least one global shift with a regional consequence and one regional-first story
    min: 2
    max: 4
    min_total: 11             # a deep story scores at least this (of 21); fewer than three qualify → fewer deep
    flex_total: 18            # a fourth deep story needs at least this
    seconds: [60, 180]
  quick: 3
  quick_seconds: [30, 45]
  radar: 3                    # one line each, with its reason
  # The Africa and Türkiye seats are scoring.min_per_region above; they apply to the slots too. A seat story
  # takes a quick slot only from deep.min_total up; a weaker one gets a radar line (founder 2026-11-23).
  shorts:
    max: 7                    # candidates: one fact + one implication + one question, no figure outside the sources
                              # (7 = one explainer a day, founder 2026-11-24: more Shorts, more chances in the feed)
    breaking_hours: 48        # "breaking context" only for news this fresh

radar:
  # Names NOT on the watchlist. Extraction needs ANTHROPIC_API_KEY (Haiku 5.5, ≈$0.05/week);
  # without it only the hard signals run. Threshold agreed 2026-10-12: 2 sources + 1 signal.
  enabled: true
  extraction:
    provider: anthropic       # anthropic | ollama  (anthropic for production quality; ollama for free local testing)
    model: claude-haiku-5-5   # used when provider: anthropic (≈$0.05/week)
    ollama_url: http://localhost:11434   # or set OLLAMA_HOST; the weekly job must run where Ollama runs
    ollama_model: qwen2.5     # pick from `ollama list`; qwen2.5/qwen3 ≥ 7B tag reliably, 1.5B models do not
    ollama_batch: 5           # items per local call; 5 suits a 7B model, 8-10 for 14B+
    ollama_timeout_s: 600
  min_sources: 2
  min_signals: 1
  max_surfaced: 3           # at most this many radar items offered to the editor
  hf_trending: true
  openrouter: true
  github: true
  github_min_stars: 300
  hackernews: true
  hn_min_points: 150

scripting:
  model: claude-opus-5-5
  effort: high                # Opus 5.5 defaults to medium. xhigh spent the whole 32K budget thinking (run #2); high is the writing sweet spot
  target_minutes: 11          # founder 2026-11-17 (monetisation playbook): English lands at 11 to 12 minutes
  words_per_minute: 130       # measured pace of formal Arabic news delivery; tune to your twin's voice
  length_tolerance: 0.10      # ±10% of target word count before a revision pass is triggered
  max_revisions: 2
  aux_model: claude-sonnet-5-5   # per-sentence source map (mechanical attribution)
  critic:                     # listener-side quality gate, scored by a "head of news" pass
    model: claude-opus-5-5
    samples: 2                # score twice; a third sample breaks ties when any axis differs by more than max_disagreement
    max_disagreement: 1
    min_score: 7   # 2026-10-13: five rounds on the sample week plateaued at 7 with the critic contradicting itself; 7 across the board is airable, its notes are the editor's checklist              # every score (hook, clarity, pacing, flow, arabic, value) must reach this
    max_rounds: 2             # fix-and-rescore rounds before we stop and flag it
  stories_min: 5
  stories_max: 7
  channel_name: "أسبوع الذكاء الاصطناعي"   # spoken in the intro/outro
  presenter_name: "وسام"
  # English version (phase translate → output/<week>-en). Unset model = `model` above.
  channel_name_en: "AI This Week"
  presenter_name_en: "Wissam"
  words_per_minute_en: 150    # English narration pace (estimate until measured on the English clone)

video:
  provider: heygen            # heygen | elevenlabs_did
  # How [Pause] markers reach the speech engine:
  #   ssml     → <break time="0.8s"/> (ElevenLabs multilingual v2; HeyGen voices that support it)
  #   ellipsis → "..." (works everywhere, less precise)
  pause_style: ssml
  pause_seconds: 0.8
  max_chars_per_chunk: 1500   # sentence-aligned chunks; well under every provider's per-request limit
  voicefirst:                 # voice-first route (pipeline/video/voicefirst.py): speech + avatar only on the face chunks
    max_chars: 2400           # per speech call (voice chunks); 4500 timed out at HeyGen after 60 s (W46)
    gap_seconds: 0.25         # natural pause between chunks in narration.wav
    faces: all                # all = every [Face] stretch is a face chunk (opening, each story change, sign-off); ends = first and last only
    face_words_max: 32        # with faces: all, the most words one face chunk holds (about 10 s)
    upright_face: side        # an upright face clip: side = full height beside a branded frame; crop = cut to the wide frame
    face_top: 0.5             # where a face clip is cropped to the frame: 0 = its top edge, 0.5 = the middle
    tempo: 1.0                # speed of generated speech (and its face clips); the pitch is kept
    tempo_en: 0.94              # 0.88 after the first feedback sounded flat; founder picked the faster sample 2026-11-16
    tempo_short_en: 1.04      # Shorts only (breaking and explainer): the middle of the Short. Viewers found 0.94 slow (2026-11-23); 1.08 all the way through was too fast (founder 2026-11-24)
    pace_short_ends: 0.9      # Shorts only: the opening line and the closing line play at tempo_short x this (1.04 x 0.9 = 0.94, the episode's pace); 1.0 = one pace throughout
    backdrop: "0x0B1220"      # behind the narration where no face video sits (always covered by visuals)
  own_voice:                  # the founder's own recording (pipeline/video/guided.py, ownvoice.py)
    model: large-v3-turbo     # recogniser for the edit: hears short repeats that `medium` hides
    max_pause: 0.5            # longer pauses are shortened to this
    max_cut_share: 0.2        # more of a single take cut than this → a warning on the voice check
  poll_interval_s: 20
  poll_timeout_s: 3600
  tashkeel: false             # sparse diacritics before TTS (style guide §6); turn on after a voice test confirms the engine honours them
  tashkeel_model: claude-sonnet-5-5

  heygen:
    avatar_type: talking_photo  # avatar (Instant/Studio avatar) | talking_photo (photo avatar)
    # The presenter's own avatar and voice clone (2026-10-25). These are IDs, not credentials:
    # they do nothing without HEYGEN_API_KEY. A HEYGEN_AVATAR_ID / HEYGEN_VOICE_ID secret or a
    # workflow input overrides them for a one-off render.
    # 2026-11-07: the landscape "Professional in blue shirt" photo look (2752×1536) replaces the
    # portrait "Sam -- 1" twin (dd64d6001c4e41c5a91b2fb9eead42a6, avatar_type avatar), whose face
    # shots filled only a narrow strip of the frame.
    avatar_id: 1df5311275d0482cbe916ab841005526   # "Professional in blue shirt"
    look_name: Professional in blue shirt         # as HeyGen's look picker shows it (paste-pack instructions)
    voice_id: 4c810d9c9906445f81dfd4f7d32259e0    # Jordanian voice clone, second recording
    voice_name: video1496943888                   # as HeyGen's voice picker shows it
    # English version (week folders ending in -en, phase translate): the founder's English clone.
    # pipeline/language.py swaps it in for voice_id on -en weeks (paste pack, API render, voice pack).
    voice_id_en: e1412c8894c9462eb3aa8bc8ad1f6e26
    # Face clips without a chat session (pipeline/video/faces.py, founder 2026-11-23). They are paid from the API's
    # prepaid USD wallet, apart from the plan credits. Only when a week has no reviewed/<week>/voice.yaml.
    auto_faces: true
    face_image: assets/brand/presenter/look_d_navy_blazer_rest_v3.png   # look D v3, as W47's hand-made clips
    face_engine: heygen-avatar-6   # founder 2026-11-23, after the side-by-side test (docs/LESSONS.md). Remove the line to go back to Avatar IV (then about $0.04 a second)
    face_usd_per_second: 0.10   # measured 2026-11-23 on Avatar 6: $0.70 for 7.84 s and $0.90 for 9.2 s, so $0.089 to $0.098 a second. Kept a little high so the wallet guard errs on the safe side
    face_budget_margin: 1.25    # the wallet must hold this many times the estimate before any clip is started
    face_link_days: 5           # a finished clip's link expires: older than this, the clip is fetched again
    voice_name_en: ""                             # as HeyGen's voice picker shows it, once known
    avatar_style: normal
    voice_speed: 1.0
    width: 3840               # 4K master; YouTube re-encodes 1080p from it at a visibly higher bitrate
    height: 2160
    quality: high             # HeyGen v2 render quality (omit to let the account default apply)
    background_color: "#0B1220"

  elevenlabs:
    model_id: eleven_multilingual_v2   # supports Arabic
    stability: 0.5
    similarity_boost: 0.85
    style: 0.15
    use_speaker_boost: true

  did:
    endpoint: clips           # clips (presenter_id) — the custom-avatar path on D-ID

# Premium-explainer look (config/visual_standard.md is the rulebook; these are the knobs).
visuals:
  enabled: true
  director_model: claude-sonnet-5-5   # inserts shot markers; spoken words are checked unchanged
  width: 1920                 # the edited cut; HeyGen's 4K master is scaled into it
  height: 1080
  fps: 30
  face_share: [0.10, 0.20]    # target share of runtime with the presenter full-frame (founder, 2026-10-26)
  face_share_max: 0.25
  max_face_seconds: 12
  max_visual_seconds: 9       # a longer visual is cut into parts, each a new clip of the same subject (W46-en)
  max_card_seconds: 11        # a source, number or title card may hold this long (W46-en: at 5 the rest went to filler footage)
  stock:
    providers: [pixabay, pexels]   # first with a key wins: PIXABAY_API_KEY, PEXELS_API_KEY
    # Clips rejected by eye in a review; never picked again. stock_used.json in each week's output names
    # the clip on every shot. W46-en: two clocks, a bar chart with figures on it, a street with a shop sign,
    # code with flickering grey blocks that reads as a fault (founder).
    # W47-en (founder 2026-11-20): the "Hello world!" terminal (odd) and the red-and-black 0/1 binary (repeated).
    # W47-en review (2026-11-20): red curtain, pink tissue, airplane in a desert, golden flower, disco ball, abandoned hospital.
    # W47-en review 2 (2026-11-21): a ghostly walking figure and an abandoned roller coaster.
    blocklist: [pixabay_5097, pixabay_10869, pixabay_145631, pixabay_33406, pixabay_7536, pixabay_155718, pixabay_49378, pixabay_371998, pixabay_28320, pixabay_239843, pixabay_2181, pixabay_27693, pixabay_37946, pixabay_32767, pixabay_197931, pixabay_306, pixabay_847, pixabay_5364, pixabay_27706, pixabay_6056, pixabay_6026, pixabay_746, pixabay_2176, pixabay_12126]
  dissolve_frames: 0          # off until the W45 length loss (2026-11-07) is traced; 12 = the designed dissolve
  face_mode: openers          # founder 2026-11-21: face at the open, each story's start (face_keep_seconds) and the sign-off; was minimal (2026-11-07, lip sync)
  require_face: true          # founder 2026-11-20: a render refuses face chunks without a presenter video
  face_keep_seconds: 8
  corner:
    enabled: false            # founder feedback 2026-11-07: the circle looked wrong; corner shots render full-screen
    size: 0.26                # circle diameter as a share of frame height
    margin_x: 0.04
    margin_bottom: 0.20       # clear of the subtitles
    face_crop: 0.72           # share of the presenter frame's height kept around the face (tuned 2026-11-07 for the blue-shirt look)
    face_top: 0.0

post:
  upload_height: 2160         # the YouTube file is the finished cut scaled to 4K (final_2160p.mp4); 0 = off
  # Render speed (2026-11-21): the 1080p cut and the 4K master come out of one final pass, on the hosted
  # runner's 4 CPUs. Measured on the W47-en frames (SSIM against the source, docs/LESSONS.md):
  #   1080p: slow/medium crf 18 cost as much CPU as the whole 4K encode; veryfast crf 16 = medium crf 18
  #          (SSIM 0.943 / 0.944, same size) in a quarter of the time.
  #   4K:    superfast crf 18 scores above veryfast crf 18 (SSIM 0.940 / 0.924) in 60% of the time; ~20% larger.
  final_preset: veryfast      # 1080p final_subtitled.mp4 (LinkedIn, Facebook, the preview); was slow crf 18
  final_crf: 16
  upload_preset: superfast    # 4K master final_2160p.mp4 at crf 18 (YouTube re-encodes it); was veryfast
  intermediate: {preset: veryfast, crf: 16}   # working files between passes (the cue-card pass); was medium crf 18
  workers: 4                  # parallel ffmpeg jobs (edit segments, Shorts); 0 = one per CPU
  numbers_gate: warn          # second check on every on-screen figure (scripts/number_check.py): warn | block | off
  repair:
    enabled: true             # re-voice doubled / mispronounced phrases on a finished render (post/repair.py)
    anchor_reach: 3           # words a splice may widen to reach a cleanly heard word
  overlays:
    enabled: true             # [On-Screen Text] cues become lower-third cards; [Show B-Roll] cues a corner marker
    card_seconds: 6
    broll_seconds: 4
    guide:                    # signposts for viewers who follow by reading (first viewers' feedback 2026-11-12)
      enabled: true
      topics: true            # each [Section] title as a corner chip for the whole section
      questions: true         # a question asked just before a [Pause], as a lower-third
    disclosure:               # AI-twin disclosure lower-third in the first minute (review 2026-11-07, Tier 1 #11)
      enabled: true
      text: "توأم رقمي لوسام — بموافقة وسام"
      at: 4                   # seconds; moved past any cue card it would cover, never after 60 s
      seconds: 6
  audio:                      # final audio pass, post/audio.py (review 2026-11-07, Tier 1 #9)
    enabled: true
    music: generated          # generated (our own synthesised pad, never licensed music) | <path to a wav we own> | none
    music_db: -24             # bed level under speech, dB relative to the voice (ducked by the voice)
    whoosh: true              # a sound on each [Section] cut: assets/sfx (ElevenLabs) in rotation, else the synthesised swish
    sfx_dir: assets/sfx       # made by .github/workflows/sfx.yml (scripts/make_sfx.py), founder 2026-11-21
    sfx:                      # ElevenLabs sound-generation prompts; a sound already in sfx_dir is kept
      - {name: cut_1_airy_whoosh, seconds: 1.2, prompt: "soft cinematic air whoosh transition, clean, smooth, no music, no voice"}
      - {name: cut_2_digital_swoosh, seconds: 1.2, prompt: "subtle modern digital swoosh with a soft low impact at the end, tech news broadcast transition, no music"}
      - {name: cut_3_reverse_swell, seconds: 1.5, prompt: "gentle reverse swell rising into a soft clean click, premium documentary transition, no music, no voice"}
    music_keys: true          # the bed changes key at each story (generated music only)
    accents: true             # a soft chime when a number or title card lands
    loudness_lufs: -14        # YouTube reference; W45 measured -19.6
    true_peak: -1.5
    lra: 7
  sting:
    enabled: true             # our code-rendered intro sting (sting/), spliced in after the cold open
    path: assets/intro_sting.mp4
    path_en: assets/intro_sting_en.mp4   # sting/index.html?lang=en («AI This Week · with Wissam»)
  end_card:                   # branded card appended to the final video (post/packaging.py); host portrait at the left, middle kept free
    enabled: true             # for YouTube's end-screen elements (add them in Studio: a video tile + subscribe)
    seconds: 15
    music_lufs: -20           # our generated bed under the card
  thumbnail:                  # output/<week>/thumbnail.png from plan.thumbnail_text_ar (post/packaging.py)
    enabled: true
    face: true                # a small still of the presenter at the left
  shorts:                     # native 9:16 Shorts (post/shorts.py); --shorts "a-b,c-d" overrides the picker
    hook_seconds: 2.0         # how long the opening line shows (overlay: over the first seconds of speech)
    hook_mode: overlay        # overlay: the voice starts at once, the line over the picture (founder 2026-11-24:
                              # the first 2 s decide a swipe); card: a full-screen card before the voice (until then)
    enabled: true
    count: 3                  # clips per episode (they are not posted since 2026-11-23: "old news"; the daily
                              # Shorts are breaking and explainer Shorts)
    min_seconds: 20
    max_seconds: 35           # + the end card (was 30-58 s; shorter Shorts are watched to the end more often)
    target_seconds: 28

# USD per million tokens, from anthropic.com/pricing. Left empty on purpose: the meter reports
# tokens either way and only prints a cost once these are filled in.
pricing:
  claude-opus-5-5:   {input: null, output: null}
  claude-sonnet-5-5: {input: null, output: null}
  claude-haiku-5-5:  {input: null, output: null}

publish:
  # YouTube Data API. Needs GOOGLE_CLIENT_ID/SECRET + YOUTUBE_REFRESH_TOKEN
  # (scripts/google_authorize.py youtube). Uploads private + scheduled.
  # Shown under the chapters in every English description. Facts from the founder's CV (July 2026).
  # The Welcome line in every episode (founder 2026-11-20: "introduce me on every video"); added by
  # script_format.ensure_host_intro when the script only says the first name.
  host_intro_ar: "معكم وسام كيشك. صرلي خمسة وعشرين سنة بالبرمجيات المؤسسية، بالشرق الأوسط وتركيا وأفريقيا."
  host_intro_en: "I'm Wissam Kishek. I've spent 25 years in enterprise software, across the Middle East, Türkiye and Africa."
  host_bio_en: >-
    Wissam Kishek has spent 25 years in enterprise software across the Middle East, Turkey and
    Africa, at companies including Microsoft, Oracle and TIBCO. He now advises AI and software
    companies entering the region and builds AI products of his own.
  partnerships_email: "aithisweek.partnerships@gmail.com"      # sponsors' address: set it and every new description (and scripts/youtube_partnerships.py for old ones) carries it
  privacy: private            # uploaded private and scheduled: YouTube makes it public at publish time (founder 2026-11-14)
  chapter_gate: true          # uploaded private, made public at the release time by scripts/release.py (every 20 min)
  chapter_wait_hours: 0       # 0 = public at the release time whatever the chapter list shows. YouTube makes chapter pictures two to five days after publishing (measured 2026-11-23), so waiting for them only delays the episode (W47-en: 18:40 Gulf, not 17:00)
  publish_weekday: 6          # 0=Mon … 6=Sun
  publish_hour_utc: 13        # 13:00 UTC = 17:00 Gulf on Sunday (founder 2026-11-17, playbook: Gulf evening, US East morning)
  tags: [الذكاء الاصطناعي, أخبار التقنية, AI, ChatGPT, OpenAI, Claude, Gemini, شركات, الإمارات, السعودية]
  hashtags: ["#الذكاء_الاصطناعي", "#أخبار_التقنية", "#AI"]
  tags_en: [AI, AI news, artificial intelligence, OpenAI, Claude, Gemini, NVIDIA, AI agents, Middle East, UAE, Saudi Arabia, enterprise AI]
  hashtags_en: ["#AI", "#AINews", "#ArtificialIntelligence"]
  caption_track: true         # upload the script-exact Arabic SRT (needs the youtube.force-ssl scope on the token)
  localizations: true         # English title/description from the plan's English fields
  show_name_en: AI Week       # used in the English title only when the plan has no episode_title_en
  shorts:
    enabled: false            # upload the week's Shorts (each linked to the episode); founder turns this on

social:                       # Shorts / Reels / TikTok on the platforms' own APIs (pipeline/publish/social.py)
  platforms: [youtube, instagram, facebook, tiktok, linkedin]   # a platform without its secrets is skipped
  channel_url: https://www.youtube.com/@AIThisWeekME
  whatsapp_channel_url: "https://whatsapp.com/channel/0029Vb9GAWP47XeAS2GDOm38"     # the AI This Week WhatsApp Channel invite link; Shorts captions carry it on YouTube, LinkedIn and Facebook (Instagram and TikTok show no links)
  linkedin_version: "202610"  # LinkedIn API version (YYYYMM); each is supported about a year, then bump it (202510 retired by 2026-11-18)
  linkedin_hashtags_en: ["#AI", "#ArtificialIntelligence", "#GenerativeAI", "#Technology", "#Innovation", "#FutureOfWork", "#Leadership", "#DigitalTransformation", "#TechNews", "#GCC"]   # broad reach (founder 2026-11-18)
  days: [0, 2, 4]             # Monday, Wednesday, Friday after the episode
  hour_utc: 15                # 19:00 Gulf
  require_approval: true      # a week's clips wait for `social` approve <week> (the founder's OK)
  youtube_privacy: public
  tiktok_privacy: SELF_ONLY   # until TikTok audits the app (it rejects public posts from an unaudited app); then PUBLIC_TO_EVERYONE
  tiktok_mode: inbox          # Shorts go to the founder's TikTok drafts; he pastes the caption and posts (founder 2026-11-20). "direct" needs an audited app
  instagram_api_version: v23.0
  facebook_api_version: v23.0
  max_attempts: 3             # per platform, then it is marked skipped
  hashtags_en: ["#AI", "#AINews", "#ArtificialIntelligence", "#TechNews", "#GenerativeAI", "#Technology", "#Innovation", "#FutureOfWork", "#ChatGPT", "#MiddleEast"]   # broad reach (founder 2026-11-18)

inbox:                        # the daily comment inbox (pipeline/publish/inbox.py, workflow `inbox`)
  model: claude-opus-5-5      # sorts the day's comments and drafts replies, one call a day
  max_per_day: 80             # comments sorted per run; the rest wait a day
  recurring_after: 3          # a feedback theme raised by this many different viewers goes to docs/LESSONS.md
  by_hand_days: 3             # LinkedIn/TikTok posts this recent are listed to check by hand
  auto_thanks: false          # true: a short fixed thank-you under positive comments (YouTube, Instagram)
  thanks_per_day: 20
  thanks:                     # fixed texts, used in turn; never model-written
    - "Thank you, glad it was useful!"
    - "Thanks for watching, much appreciated."
    - "Appreciate it, thank you!"

news_watch:                   # .github/workflows/news-watch.yml, every six hours (founder 2026-11-17)
  lookback_days: 2            # each run reads the last two days
  keep_days: 10               # how long an item stays in data/news_watch.json
  min_publishers: 4           # a story this many outlets carry is posted to the "News watch" issue
  article_fetches: 25         # article pages read per run

breaking:                     # breaking-news Shorts drafted from the news watch (pipeline/breaking.py; founder 2026-11-18)
  enabled: true
  hours: 8                    # stories flagged in the last 8 hours
  max_per_day: 3              # drafts a day; nothing posts without the founder's `post <week>` on the issue
  big_story_sources: 5        # a story carried by this many outlets at once still gets a Short past the daily limit (2026-11-23, Jensen returns)
  big_story_extra: 2          # ...up to this many extra a day
  tries: 2                    # stories tried per run when a draft fails its checks
  outage_min_sources: 3       # an outage with no measured impact in its articles needs this many outlets to get a Short (founder 2026-11-24, the AWS alert-delay story)
  repeat_days: 4              # a story drafted in the last 4 days is not drafted again under a new headline (founder 2026-11-20)

explainer:                    # explainer Shorts drafted from the approved ranking (pipeline/explainer.py; founder 2026-11-23)
  enabled: true
  max_per_week: 7             # one a day (founder 2026-11-24, was 2); nothing posts without `post <id>`
  jobs: [explainer, moment, breaking]   # which of the ranking's Shorts candidates are written up, in this order (the judge rarely says "explainer"; [explainer] restores the narrow rule)

# Daily health check (scripts/health.py): the longest each scheduled workflow may go without a SUCCESSFUL run before
# the "Health: needs a look" issue says so. Every workflow with a schedule needs a line (tests/test_health.py).
health:
  heygen_min_usd: 12.5        # warn when the HeyGen API wallet (speech and face clips) falls below this. A week's faces on Avatar 6 in Arabic and English: about $5.40 for the first language, then $6.75 must still be there for the second to start, so about $12.15 (2026-11-23)
  max_age_hours:
    news-watch: 8             # every two hours
    social: 6                 # hourly
    release: 6                # every 20 minutes
    channel: 6                # hourly
    inbox: 50                 # daily
    weekly-roundup: 200       # Fridays
