# ─────────────────────────────────────────────────────────────────────
# Pipeline configuration. Secrets live in .env, never here.
# ─────────────────────────────────────────────────────────────────────

ingestion:
  lookback_days: 7            # weekly roundup window
  request_timeout_s: 20

  # RSS feeds. Verify each URL before the first run: newsletters move their
  # feeds, and some (e.g. AlphaSignal) publish only by email. For an email-only
  # newsletter, forward it to a service such as Kill the Newsletter
  # (kill-the-newsletter.com), which gives you an Atom feed URL to paste here.
  rss_feeds:
    - name: TLDR AI
      url: https://tldr.tech/api/rss/ai
      weight: 1.2               # source credibility multiplier used in scoring
    - name: AlphaSignal
      url: ""                   # paste your kill-the-newsletter Atom URL here
      weight: 1.2
    - name: Import AI
      url: https://importai.substack.com/feed
      weight: 1.1
    - name: The Batch (DeepLearning.AI)
      url: https://www.deeplearning.ai/the-batch/feed/
      weight: 1.1

  # YouTube channels. From a home/office IP the Atom feeds work with no key; from a datacenter
  # (GitHub runners) YouTube answers 404, so set YOUTUBE_API_KEY (Data API v3, 1 quota unit per
  # channel per run) and the same list is read through the API. Give a handle (resolved
  # to a channel id on first run and cached in data/youtube_channels.json) or a channel_id.
  # Weight below 1: a video is a lead to verify against a written source, not a source itself.
  # lead_only: true → the channel feeds the radar (new names) but never reaches the script
  # as a source (review 2026-11-07: hype channels are radar leads only).
  youtube:
    enabled: true
    max_per_channel: 5
    channels:
      - { name: "Matt Wolfe",        handle: mreflow,              weight: 0.8 }
      - { name: "AI Explained",      handle: aiexplained-official, weight: 0.9 }
      - { name: "Wes Roth",          handle: WesRoth,              weight: 0.8, lead_only: true }
      - { name: "TheAIGRID",         handle: TheAIGRID,            weight: 0.7, lead_only: true }
      - { name: "Two Minute Papers", handle: TwoMinutePapers,      weight: 0.8 }
      - { name: "MattVidPro AI",     handle: MattVidPro,           weight: 0.7, lead_only: true }
      - { name: "Fireship",          handle: Fireship,             weight: 0.7 }
      - { name: "bycloud",           handle: bycloudAI,            weight: 0.7 }
      - { name: "Yannic Kilcher",    handle: YannicKilcher,        weight: 0.8 }
      - { name: "The AI Advantage",  handle: aiadvantage,          weight: 0.7, lead_only: true }

  # Newsletters that arrive by email. Needs GOOGLE_CLIENT_ID/SECRET + GMAIL_REFRESH_TOKEN
  # (scripts/google_authorize.py gmail). Each email is split into its stories.
  gmail:
    enabled: false
    newsletters:
      - name: TLDR AI (email)
        query: "from:tldr.tech subject:AI"
        weight: 1.2
      - name: AlphaSignal
        query: "from:alphasignal.ai"
        weight: 1.2
      - name: The Rundown AI
        query: "from:therundown.ai"
        weight: 1.0

  x:
    enabled: true
    top_n: 10                 # keep the 10 highest-engagement posts of the week
    max_posts_per_account: 100
    accounts:
      - emollick
      - rowancheung
      - karpathy
      - AndrewYNg
      - simonw

  # Sources driven by config/watchlist.yaml (all free, no keys)
  watchlist:
    enabled: true
    google_news: true         # one search feed per watched name
    official_feeds: true      # the names' own blogs / newsrooms
    github: true              # releases of watched repos (set GITHUB_TOKEN to lift the anonymous rate limit)
    huggingface: true         # new models from watched organisations
    max_per_entity: 8         # Google News items kept per name per week
    # Google News items carry only headline + publisher. Resolve the link to the publisher's page
    # and keep the article text (best effort; paywalls and failures keep the headline).
    fetch_articles:
      enabled: true
      max_items: 60           # page fetches per run (two requests each at most)
      timeout_s: 8
      max_chars: 2500         # same cap as RSS bodies

  # Regional outlets (Gulf + Levant), read as Google News site: searches so no feed URL has to be
  # guessed. Publisher tiers for the credit come from config/publishers.yaml.
  google_news_sites:
    - { name: The National,  query: "site:thenationalnews.com", region: gulf }
    - { name: Arab News,     query: "site:arabnews.com",        region: gulf }
    - { name: WAM,           query: "site:wam.ae",              region: gulf }
    - { name: SPA,           query: "site:spa.gov.sa",          region: gulf }
    - { name: Zawya,         query: "site:zawya.com",           region: gulf }
    - { name: Wamda,         query: "site:wamda.com",           region: levant }
    - { name: MoDEE Jordan,  query: "site:modee.gov.jo",        region: levant }
    - { name: Jordan News Agency, query: "site:petra.gov.jo",   region: levant }

scoring:
  min_score: 2.0              # items below this are dropped as noise
  max_items: 30               # cap handed to the scripting engine
  min_per_track:              # reserved seats so every beat of the episode has material
    models: 8
    agents: 5
    chips: 4
    radar: 1
  dedupe_similarity: 0.82     # title similarity above which two items are duplicates

radar:
  # Names NOT on the watchlist. Extraction needs ANTHROPIC_API_KEY (Haiku 5.5, ≈$0.05/week);
  # without it only the hard signals run. Threshold agreed 2026-10-12: 2 sources + 1 signal.
  enabled: true
  extraction:
    provider: anthropic       # anthropic | ollama  (anthropic for production quality; ollama for free local testing)
    model: claude-haiku-5-5   # used when provider: anthropic (≈$0.05/week)
    ollama_url: http://localhost:11434   # or set OLLAMA_HOST; the weekly job must run where Ollama runs
    ollama_model: qwen2.5     # pick from `ollama list`; qwen2.5/qwen3 ≥ 7B tag reliably, 1.5B models do not
    ollama_batch: 5           # items per local call; 5 suits a 7B model, 8-10 for 14B+
    ollama_timeout_s: 600
  min_sources: 2
  min_signals: 1
  max_surfaced: 3           # at most this many radar items offered to the editor
  hf_trending: true
  openrouter: true
  github: true
  github_min_stars: 300
  hackernews: true
  hn_min_points: 150

scripting:
  model: claude-opus-5-5
  effort: high                # Opus 5.5 defaults to medium. xhigh spent the whole 32K budget thinking (run #2); high is the writing sweet spot
  target_minutes: 8
  words_per_minute: 130       # measured pace of formal Arabic news delivery; tune to your twin's voice
  length_tolerance: 0.10      # ±10% of target word count before a revision pass is triggered
  max_revisions: 2
  aux_model: claude-sonnet-5-5   # per-sentence source map (mechanical attribution)
  critic:                     # listener-side quality gate, scored by a "head of news" pass
    model: claude-opus-5-5
    samples: 2                # score twice; a third sample breaks ties when any axis differs by more than max_disagreement
    max_disagreement: 1
    min_score: 7   # 2026-10-13: five rounds on the sample week plateaued at 7 with the critic contradicting itself; 7 across the board is airable, its notes are the editor's checklist              # every score (hook, clarity, pacing, flow, arabic, value) must reach this
    max_rounds: 2             # fix-and-rescore rounds before we stop and flag it
  stories_min: 5
  stories_max: 7
  channel_name: "أسبوع الذكاء الاصطناعي"   # spoken in the intro/outro
  presenter_name: "وسام"
  # English version (phase translate → output/<week>-en). Unset model = `model` above.
  channel_name_en: "This Week in AI"
  presenter_name_en: "Wissam"
  words_per_minute_en: 150    # English narration pace (estimate until measured on the English clone)

video:
  provider: heygen            # heygen | elevenlabs_did
  # How [Pause] markers reach the speech engine:
  #   ssml     → <break time="0.8s"/> (ElevenLabs multilingual v2; HeyGen voices that support it)
  #   ellipsis → "..." (works everywhere, less precise)
  pause_style: ssml
  pause_seconds: 0.8
  max_chars_per_chunk: 1500   # sentence-aligned chunks; well under every provider's per-request limit
  voicefirst:                 # voice-first route (pipeline/video/voicefirst.py): speech + avatar only on the face chunks
    max_chars: 4500           # per speech call (voice chunks)
    gap_seconds: 0.25         # natural pause between chunks in narration.wav
    upright_face: side        # an upright face clip: side = full height beside a branded frame; crop = cut to the wide frame
    face_top: 0.5             # where a face clip is cropped to the frame: 0 = its top edge, 0.5 = the middle
    tempo: 1.0                # speed of generated speech (and its face clips); the pitch is kept
    tempo_en: 0.88            # the English clone speaks ~185 words/min; first viewers asked for slower (→ ~163)
    backdrop: "0x0B1220"      # behind the narration where no face video sits (always covered by visuals)
  own_voice:                  # the founder's own recording (pipeline/video/guided.py, ownvoice.py)
    model: large-v3-turbo     # recogniser for the edit: hears short repeats that `medium` hides
    max_pause: 0.5            # longer pauses are shortened to this
    max_cut_share: 0.2        # more of a single take cut than this → a warning on the voice check
  poll_interval_s: 20
  poll_timeout_s: 3600
  tashkeel: false             # sparse diacritics before TTS (style guide §6); turn on after a voice test confirms the engine honours them
  tashkeel_model: claude-sonnet-5-5

  heygen:
    avatar_type: talking_photo  # avatar (Instant/Studio avatar) | talking_photo (photo avatar)
    # The presenter's own avatar and voice clone (2026-10-25). These are IDs, not credentials:
    # they do nothing without HEYGEN_API_KEY. A HEYGEN_AVATAR_ID / HEYGEN_VOICE_ID secret or a
    # workflow input overrides them for a one-off render.
    # 2026-11-07: the landscape "Professional in blue shirt" photo look (2752×1536) replaces the
    # portrait "Sam -- 1" twin (dd64d6001c4e41c5a91b2fb9eead42a6, avatar_type avatar), whose face
    # shots filled only a narrow strip of the frame.
    avatar_id: 1df5311275d0482cbe916ab841005526   # "Professional in blue shirt"
    look_name: Professional in blue shirt         # as HeyGen's look picker shows it (paste-pack instructions)
    voice_id: 4c810d9c9906445f81dfd4f7d32259e0    # Jordanian voice clone, second recording
    voice_name: video1496943888                   # as HeyGen's voice picker shows it
    # English version (week folders ending in -en, phase translate): the founder's English clone.
    # pipeline/language.py swaps it in for voice_id on -en weeks (paste pack, API render, voice pack).
    voice_id_en: e1412c8894c9462eb3aa8bc8ad1f6e26
    voice_name_en: ""                             # as HeyGen's voice picker shows it, once known
    avatar_style: normal
    voice_speed: 1.0
    width: 3840               # 4K master; YouTube re-encodes 1080p from it at a visibly higher bitrate
    height: 2160
    quality: high             # HeyGen v2 render quality (omit to let the account default apply)
    background_color: "#0B1220"

  elevenlabs:
    model_id: eleven_multilingual_v2   # supports Arabic
    stability: 0.5
    similarity_boost: 0.85
    style: 0.15
    use_speaker_boost: true

  did:
    endpoint: clips           # clips (presenter_id) — the custom-avatar path on D-ID

# Premium-explainer look (config/visual_standard.md is the rulebook; these are the knobs).
visuals:
  enabled: true
  director_model: claude-sonnet-5-5   # inserts shot markers; spoken words are checked unchanged
  width: 1920                 # the edited cut; HeyGen's 4K master is scaled into it
  height: 1080
  fps: 30
  face_share: [0.10, 0.20]    # target share of runtime with the presenter full-frame (founder, 2026-10-26)
  face_share_max: 0.25
  max_face_seconds: 12
  max_visual_seconds: 12      # longer visuals switch to the corner layout halfway
  stock:
    providers: [pixabay, pexels]   # first with a key wins: PIXABAY_API_KEY, PEXELS_API_KEY
  dissolve_frames: 0          # off until the W45 length loss (2026-11-07) is traced; 12 = the designed dissolve
  face_mode: minimal          # founder 2026-11-07 (lip sync): face only at the open and the sign-off
  face_keep_seconds: 8
  corner:
    enabled: false            # founder feedback 2026-11-07: the circle looked wrong; corner shots render full-screen
    size: 0.26                # circle diameter as a share of frame height
    margin_x: 0.04
    margin_bottom: 0.20       # clear of the subtitles
    face_crop: 0.72           # share of the presenter frame's height kept around the face (tuned 2026-11-07 for the blue-shirt look)
    face_top: 0.0

post:
  upload_height: 2160         # the YouTube file is the finished cut scaled to 4K (final_2160p.mp4); 0 = off
  repair:
    enabled: true             # re-voice doubled / mispronounced phrases on a finished render (post/repair.py)
    anchor_reach: 3           # words a splice may widen to reach a cleanly heard word
  overlays:
    enabled: true             # [On-Screen Text] cues become lower-third cards; [Show B-Roll] cues a corner marker
    card_seconds: 6
    broll_seconds: 4
    guide:                    # signposts for viewers who follow by reading (first viewers' feedback 2026-11-12)
      enabled: true
      topics: true            # each [Section] title as a corner chip for the whole section
      questions: true         # a question asked just before a [Pause], as a lower-third
    disclosure:               # AI-twin disclosure lower-third in the first minute (review 2026-11-07, Tier 1 #11)
      enabled: true
      text: "توأم رقمي لوسام — بموافقة وسام"
      at: 4                   # seconds; moved past any cue card it would cover, never after 60 s
      seconds: 6
  audio:                      # final audio pass, post/audio.py (review 2026-11-07, Tier 1 #9)
    enabled: true
    music: generated          # generated (our own synthesised pad, never licensed music) | <path to a wav we own> | none
    music_db: -24             # bed level under speech, dB relative to the voice (ducked by the voice)
    whoosh: true              # synthesised swish on each [Section] cut
    loudness_lufs: -14        # YouTube reference; W45 measured -19.6
    true_peak: -1.5
    lra: 7
  sting:
    enabled: true             # our code-rendered intro sting (sting/), spliced in after the cold open
    path: assets/intro_sting.mp4
    path_en: assets/intro_sting_en.mp4   # sting/index.html?lang=en («This Week in AI · with Wissam»)
  end_card:                   # branded card appended to the final video (post/packaging.py); left side kept empty
    enabled: true             # for YouTube's end-screen elements (add them in Studio: a video tile + subscribe)
    seconds: 15
    music_lufs: -20           # our generated bed under the card
  thumbnail:                  # output/<week>/thumbnail.png from plan.thumbnail_text_ar (post/packaging.py)
    enabled: true
    face: true                # a small still of the presenter at the left
  shorts:                     # native 9:16 Shorts (post/shorts.py); --shorts "a-b,c-d" overrides the picker
    enabled: true
    count: 3
    min_seconds: 30
    max_seconds: 58           # + the 2 s «الحلقة الكاملة على القناة» card

# USD per million tokens, from anthropic.com/pricing. Left empty on purpose: the meter reports
# tokens either way and only prints a cost once these are filled in.
pricing:
  claude-opus-5-5:   {input: null, output: null}
  claude-sonnet-5-5: {input: null, output: null}
  claude-haiku-5-5:  {input: null, output: null}

publish:
  # YouTube Data API. Needs GOOGLE_CLIENT_ID/SECRET + YOUTUBE_REFRESH_TOKEN
  # (scripts/google_authorize.py youtube). Uploads private + scheduled.
  privacy: unlisted           # pilot: unlisted for the first 5 episodes; switch to private+scheduled or public when the pilot passes
  publish_weekday: 6          # 0=Mon … 6=Sun
  publish_hour_utc: 6         # 06:00 UTC = 10:00 Gulf
  tags: [الذكاء الاصطناعي, أخبار التقنية, AI, ChatGPT, OpenAI, Claude, Gemini, شركات, الإمارات, السعودية]
  hashtags: ["#الذكاء_الاصطناعي", "#أخبار_التقنية", "#AI"]
  caption_track: true         # upload the script-exact Arabic SRT (needs the youtube.force-ssl scope on the token)
  localizations: true         # English title/description from the plan's English fields
  show_name_en: AI Week       # used in the English title only when the plan has no episode_title_en
  shorts:
    enabled: false            # upload the week's Shorts (each linked to the episode); founder turns this on
