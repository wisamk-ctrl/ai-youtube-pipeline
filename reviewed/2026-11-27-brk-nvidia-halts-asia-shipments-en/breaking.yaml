title: Nvidia Halts Asia Chip Shipments
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: 'Nvidia has told partners to pause AI server shipments to four South-East
  Asian countries.


  The Financial Times reports that Dell and Supermicro informed customers in Malaysia,
  Singapore, Thailand and Indonesia that Nvidia will not authorise their orders, as
  the US tightens export controls to keep advanced AI computing away from China. Nvidia
  recorded $104 billion in revenue through its Singapore subsidiary in 2025, and a
  cloud executive told the FT the unclear licensing rules are causing chaos in the
  region.


  For the Gulf''s fast-growing data centre sector, it is a reminder that access to
  AI chips can change quickly with export policy.'
