title: Anthropic Shares Fall After IPO
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: Anthropic's stock market debut lost half its gains in a single day. The
  BBC reports the shares closed up 17% at $97.17 on Thursday, then fell as much as
  12% on Friday to about $85, near the $83 IPO price, before closing down 8.5%. The
  Nasdaq plunged 5.3% amid concerns over the speed and size of AI investment, with
  more than $1 trillion spent in the last year by a handful of major tech companies.
  For the Gulf, the thing to watch is whether this investor caution affects the pace
  of the AI and data center projects the region is building.
