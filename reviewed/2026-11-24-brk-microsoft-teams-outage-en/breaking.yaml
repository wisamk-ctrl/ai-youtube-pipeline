title: Microsoft Teams Suffers Outage
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: More than 130,000 users reported problems when Microsoft's Exchange Online
  and Teams failed for hours. Computer Weekly calls it a major outage of Microsoft's
  online applications, and its data shows how deeply the UK public sector relies on
  these services. The Defiant reports that a Microsoft outage review found gaps in
  server testing. For Gulf organisations running daily work on the same tools, it
  is a reminder to ask how operations would continue if they went dark.
