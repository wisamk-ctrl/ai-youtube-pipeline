title: Alpöge Claims Riemann Proof
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: An Anthropic mathematician says Claude helped him prove the Riemann hypothesis.
  Levent Alpöge posted the claim on Friday, saying the AI helped develop the solution
  over about six weeks, The Guardian reports. On Saturday, the Lean Focused Research
  Organization and the Mathlib Initiative said they had independently verified the
  proof of the problem first proposed in 1859. For the Gulf, it is a signal to watch
  how AI-assisted discovery could change the way research institutions and national
  science programmes work.
