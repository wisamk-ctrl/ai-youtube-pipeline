title: US Air Force Cloud One Breached
end_text: More on this in Sunday's episode
question: Would your government trust one shared cloud platform now?
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: Hackers have breached one of the US military's largest cloud platforms.
  Reuters reports the intrusion into the US Air Force's Cloud One, which pools cloud
  resources from Microsoft, Amazon, Oracle and Alphabet, was found during an upgrade
  and has disrupted operations. Who did it and whether data was stolen remains unclear,
  and migrations to the platform have been suspended. For Gulf governments consolidating
  services onto shared clouds, it is a reminder that one central management layer
  can become one central point of risk.
