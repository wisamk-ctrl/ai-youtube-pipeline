title: OpenAI Countersues Apple
end_text: More on this in Sunday's episode
question: Would Gulf companies choose OpenAI devices over iPhones?
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: OpenAI has countersued Apple, alleging theft of trade secrets. In a filing
  dated 27 November in a California federal court, OpenAI claims Apple obtained its
  device roadmap through a re-hired engineer and pressured shared suppliers; it says
  around 400 specialists have moved from Apple to OpenAI. Apple, which sued first
  in July, rejects the allegations. For Gulf enterprises standardised on Apple hardware,
  a new AI device contender built with Jony Ive's team could reshape future device
  choices.
