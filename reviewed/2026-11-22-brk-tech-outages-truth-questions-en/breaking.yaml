linkedin: Is the public being told the truth about the recent run of tech outages?
  A Gulf Today column raises the question after the US grounded all departing flights,
  only the second time since the September 11 attacks, and Microsoft went down for
  nearly 24 hours. The column also cites outages at several American banks, a brief
  Apple outage and a temporary outage on the National Security Agency's internal network,
  while one cyber insider argues the baseline number of reports hasn't changed, only
  the newsworthiness threshold. For the Gulf, as more public and business services
  move onto digital platforms, how operators communicate about outages is worth watching.
