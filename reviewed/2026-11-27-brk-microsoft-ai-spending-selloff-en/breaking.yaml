title: Microsoft Shares Fall 13%
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: Microsoft shares are down about 13% from their all-time highs as investors
  worry about AI spending, Yahoo Finance reports. The company spent $45.2 billion
  on capex in its fiscal first quarter, yet free cash flow stayed positive at $18.6
  billion, while Azure revenue grew 48% year on year. Microsoft holds 21% of the global
  cloud infrastructure market, and nearly 4 million companies use Microsoft 365. For
  Gulf organisations building on Azure and Copilot, the spending race shows how much
  capacity the major cloud providers are adding to keep up with AI demand.
