title: Why So Many Tech Outages?
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: 'A massive Microsoft outage, US flights grounded and bank payments disrupted,
  all in one week.

  The BBC reports there is no evidence the incidents are linked, and many followed
  system updates going wrong, including a Microsoft network upgrade that overloaded
  servers. JP Morgan Chase put US bank payment disruption down to a software bug and
  says it was not a cyber-security incident. Meanwhile, AI was used to find flaws
  in Java, and Anthropic and OpenAI now give select companies early access to their
  most advanced models so defenders can find flaws first.

  For the Gulf, the thing to watch is how operators of critical systems test their
  updates and who gets early access to defensive AI.'
