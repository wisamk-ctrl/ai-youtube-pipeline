title: Microsoft Sued in Canada
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: 'Microsoft''s November outage has reached the courts in Canada.

  Courthouse News reports a pair of class actions over the blackout that blocked users
  from paid Microsoft services on November 12 and 13. One Quebec suit argues Microsoft
  should have anticipated the outage given other major outages in 2025, while a second
  seeks to represent all Canadians, including businesses. Microsoft says a latent
  defect from July and reduced server capacity were to blame, not a cyberattack.

  For Gulf organisations running on global cloud platforms, it is worth watching how
  outage liability starts to shape service contracts.'
