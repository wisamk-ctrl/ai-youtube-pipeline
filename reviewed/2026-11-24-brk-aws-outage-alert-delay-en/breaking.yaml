title: AWS Slow to Flag Major Outage
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: AWS took 93 minutes to post its first status update during a major outage.
  The disruption hit the US East region on November 15, running from 3:05 a.m. to
  6:53 a.m. and affecting more than 10 major services, mainly IAM Identity Center.
  The Register reports AWS questioned Downdetector's reliability rather than explaining
  the failure. For Gulf enterprises relying on global cloud providers, how quickly
  incidents are disclosed is something to watch.
