title: Anthropic Goes Public at $83
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: Anthropic, the maker of Claude, is now a public company. Yahoo Finance reports
  it sold 980 million shares at $83 each, above its marketed range, valuing it at
  about $1.5 trillion on a fully diluted basis. The BBC says shares closed 17% higher
  on the first day at $97.17, even as the wider tech sector fell 2.4%. Third-quarter
  revenue reached $16.96 billion, while the company still runs at an operating loss
  and has committed to spending about $895 billion. For the Gulf, the thing to watch
  is whether this new capital turns into data center and compute partnerships in the
  region.
