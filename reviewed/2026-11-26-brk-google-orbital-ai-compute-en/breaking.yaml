title: Google Books Blue Origin Launch
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: Google wants to know if AI computing can work in orbit. The company has
  booked a Blue Origin New Glenn launch for the first quarter of 2029 for Project
  Suncatcher, which will test solar-powered satellites carrying Google's Tensor Processing
  Units at roughly the scale of individual data center racks. Data Center Knowledge
  reports that heat rejection is the biggest engineering obstacle, and IDC's Dave
  McCarthy notes that no technician can swap a failed GPU at 500 kilometers. For the
  Gulf, where data centers are being built at speed, the test is an early sign of
  where AI infrastructure might go beyond the ground.
