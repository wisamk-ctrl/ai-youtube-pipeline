title: Jay Clayton Expects More Outages
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: 'The US intelligence chief says more tech outages are coming, and blames
  patching, not attackers.


  Director of National Intelligence Jay Clayton told CNN that upgrading and patching
  aging systems will bring glitches, gaps and interruptions in service, and said on
  ABC the recent outages were not coordinated or state-sponsored. He declined to explain
  a suspected FBI hack and a USDA security incident. Security firm Wiz says the PHP2Shell
  flaws, found with AI help, affect software powering about 70% of websites; PHP issued
  patches around October 21.


  For Gulf businesses and governments running older systems, the thing to watch is
  how investigators separate patch-driven failures from real intrusions.'
