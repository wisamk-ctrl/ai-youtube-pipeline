title: 'CrowdStrike Buys Zscaler: $44B'
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: 'CrowdStrike is buying Zscaler for $43.9 billion in an all-stock deal. The
  Register calls it the biggest cybersecurity acquisition on record, ahead of Google''s
  $32 billion purchase of Wiz. CrowdStrike protects devices; Zscaler secures networks
  with zero-trust technology. CrowdStrike says owning both lets it see what AI agents
  do on corporate devices, where they connect and what data they reach. The deal still
  needs regulators and Zscaler shareholders, and is expected to close in the second
  half of CrowdStrike''s fiscal 2028. My view: as AI agents start to browse and act
  for us, this is a seismic move for security. For Gulf organisations, the question
  is how much of their defence they want with one vendor.'
