title: Microsoft 365 Goes Down Globally
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: Microsoft 365 went down for over 20 hours, and the fallout went beyond email.
  InformationWeek reports the Outlook and 365 outage drew more than 7 million reports
  on Downdetector, the largest there in the last 12 months. Microsoft says the disruption
  was not caused by malicious actors, but Microsoft Threat Intelligence observed a
  coordinated, high-volume phishing campaign targeting enterprises globally. In U.S.
  hospitals, experts say patient care largely continued while staff relied on manual
  workarounds. For Gulf organisations that run on a single cloud provider, this is
  a case to watch on how far continuity plans really reach.
