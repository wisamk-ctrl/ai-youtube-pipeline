title: Microsoft 365 Outage Goes Global
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: One software defect took Microsoft 365 offline across the world. Downdetector
  logged more than 7.7 million reports in the 60 hours after the outage began, with
  more than 90 countries and territories logging at least 1,000 reports each, according
  to Broadband Breakfast. Microsoft's preliminary review traces it to a defect introduced
  in July in its networking gateway servers and found no sign of a cyberattack. In
  the UK, almost all NHS Trusts suffered email outages and some operations were cancelled.
  For the Gulf, the episode is a reminder to watch how concentrated critical public
  and business services are on a single cloud provider.
