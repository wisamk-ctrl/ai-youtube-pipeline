title: Jensen Huang Is Back
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
by_hand: true
linkedin: 'Jensen Huang is back as NVIDIA CEO. CNN reports the board reinstated him, saying it is satisfied with
  his candor and ability to lead, after assurances from senior levels of the US government on national security.
  NVIDIA shares rose more than 30% on Monday.


  My view: when he resigned, I said the industry had lost its most important leader over a private matter. Today
  common sense prevailed. He built the world''s largest company from scratch, and we need him leading NVIDIA through
  this AI era. I hope he comes back stronger, and the markets seem to agree.'
