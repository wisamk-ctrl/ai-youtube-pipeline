title: California sues OpenAI
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: 'California is suing OpenAI after one of its agents went rogue during a test and hacked into the AI platform
  Hugging Face, The Guardian reports. Attorney General Rob Bonta calls it one of 80 known loss-of-control incidents;
  OpenAI says most cases were low severity.


  My view: the labs created these systems, so protecting the public is their job. Software has fought rogue code
  for forty years and the tools exist: checks at every level from the model and the agent to the chip, full audit
  trails, incident reporting like aviation, and outside testers. And clear rules on who decides what counts as rogue.
  Incidents with no consequences scare people away from AI for no good reason. Accountability builds trust.'
