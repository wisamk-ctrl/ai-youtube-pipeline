title: OpenAI and Cisco Launch Shirudo
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: 'OpenAI and Cisco have launched Shirudo, an open-source project for AI-driven
  cyber defense. According to Channel Insider, it uses AI agents and eBPF kernel-level
  defenses to protect vulnerable infrastructure before permanent patches can be deployed.
  Gulf Business reports it is built to combat AI-driven cyberattacks and block Java4shell
  exploits. For Gulf organisations running critical digital infrastructure, it raises
  a practical question: how much of the gap between disclosure and patching should
  AI agents be trusted to cover?'
