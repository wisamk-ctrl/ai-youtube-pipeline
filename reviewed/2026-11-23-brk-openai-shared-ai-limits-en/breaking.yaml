title: Jakub Pachocki Urges AI Limits
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: OpenAI's chief scientist is asking rival labs to agree on a shared ceiling
  for AI capability. In an essay published November 22, Jakub Pachocki proposed common
  limits based on perplexity and other measurements, which labs would not cross until
  they can better understand and monitor model behavior. OpenAI published its own
  perplexity scores for the first time, and CEO Sam Altman backed the proposal, though
  reports note no limit value, start date or governing body has been named. For Gulf
  governments and companies investing heavily in AI infrastructure, it is worth watching
  whether such shared limits evolve into an industry standard that shapes how models
  are built and deployed in the region.
