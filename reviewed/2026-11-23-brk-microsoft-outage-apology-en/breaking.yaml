title: Brad Smith Apologises for Outage
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: 'Microsoft''s president has apologised again for a global outage that hobbled
  corporations.

  Speaking on CBS''s Face the Nation, Brad Smith said the outage was not linked to
  AI and was not a cyberattack, but a perfect storm of an older software update, a
  new update and a shift in network traffic. Microsoft says it has taken nine steps
  already and plans 13 more. Smith also described the wider wave of tech outages as,
  in substantial part, AI ripple effects, as AI made vulnerabilities in code easier
  to find.

  For Gulf businesses and governments that rely on global cloud platforms, how providers
  report and fix outages like this is worth watching.'
