title: OpenAI Pays Locals to Teach AI
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: 'OpenAI wants locals, not consultants, to bring AI to small businesses.
  Its OpenWorks pilot pairs people with AI skills with small business owners in 20
  U.S. cities, and the help comes at no cost to owners, who also get three free months
  of ChatGPT Business. Partners can receive stipends of up to $8,000 a month, and
  the pilot targets restaurants, shops, factories and service businesses. For the
  Gulf, it raises a question: could community-based AI support help the region''s
  small and family businesses adopt AI faster?'
