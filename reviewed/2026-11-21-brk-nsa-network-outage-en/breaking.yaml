title: NSA Network Hit by Patch Fault
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: A security patch, not a hacker, may be behind an outage at a key NSA hub.
  A computer fault recorded since November 16 has disrupted an NSA facility in Georgia
  that supports Middle East-focused intelligence and cyber operations, affecting NSANet,
  the agency's internal network for classified information. U.S. officials told CNN
  the outage was linked to software updates fixing vulnerabilities, tied to systems
  using PHP, and that a cyberattack has been ruled out. For Gulf governments and businesses
  running critical networks, the question to watch is how well systems recover when
  routine security patching goes wrong.
