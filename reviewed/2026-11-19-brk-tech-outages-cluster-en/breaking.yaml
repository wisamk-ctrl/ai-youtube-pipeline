title: A Week of Major Tech Outages
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: 'Microsoft, Apple, JPMorgan Chase, United Airlines and the NSA all had major
  tech failures in the same week.


  Scientific American reports Microsoft''s cloud software was down for almost 24 hours,
  yet the company says neither malicious activity nor AI agents were to blame. Apple''s
  outage followed an internal update, and the NSA says its problems arose during scheduled
  maintenance. The Uptime Institute found data center outage rates per site fell in
  2026 for a fifth consecutive year.


  For the Gulf, as cloud dependence grows, how providers manage changes to complex
  systems is worth watching.'
