title: US Tech Outages Spark Alarm
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: 'A wave of US tech outages has reached the White House agenda.


  CNBC reports Vice President JD Vance canceled a summit appearance to attend meetings
  on outages that include a nationwide ground stop, a Microsoft Outlook outage and
  a reported blackout of an NSA classified network. A senior administration official
  says the incidents are not a cyberattack but upgrades, patches and other disparate
  events, while calling AI''s role challenging to assess. Senator Mark Warner says
  he wants better coordination on AI safety.


  For the Gulf, the thing to watch is whether this brings new scrutiny of how critical
  systems are upgraded and how AI safety is coordinated.'
