title: Anthropic Falls Below IPO Price
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: 'Anthropic''s stock has slipped below its $83 IPO price, days after going
  public.


  TechCrunch reports shares traded as low as $76 by midday Tuesday, down nearly 12%
  from Monday''s close, less than a week after a Nasdaq debut at $111.50. Observers
  see the stock as a barometer for how public markets value AI, and Nvidia also fell
  more than 7% on the day. The Motley Fool reports Anthropic''s revenue surged 1,200%
  to $33.24 billion in the first nine months of the year.


  For Gulf businesses and governments building on frontier AI models, the market''s
  view of these labs is now a factor worth watching when choosing long-term technology
  partners.'
