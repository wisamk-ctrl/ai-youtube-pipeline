title: Air Force Cloud Hack Reported
end_text: More on this in Sunday's episode
question: Would Gulf governments keep military data on cloud platforms now?
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: Reuters reports that hackers breached the US Air Force's Cloud One platform.
  NBC News, citing an unnamed official, says the attack could have exposed sensitive
  military information, while the Pentagon said its systems are safe and secure without
  specifically denying the breach. Federal News Network says contractors discovered
  the hack earlier this year during maintenance. For Gulf governments moving sensitive
  workloads to the cloud, the report is a reminder that security and oversight of
  contractors matter as much as the platform itself.
