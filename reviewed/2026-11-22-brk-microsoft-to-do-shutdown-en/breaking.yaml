title: Microsoft Shuts Down To Do App
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: Microsoft is retiring To Do after nearly 10 years. According to the company's
  announcement, the app shuts down on June 30, 2027, across Windows, Mac, Android,
  iOS and the web, and existing tasks will not migrate to Microsoft Planner. Planner
  is not available to personal account holders, and export details have not yet been
  published. For Gulf organisations built on Microsoft tools, this is one to watch
  as teams plan how their task data moves before the deadline.
