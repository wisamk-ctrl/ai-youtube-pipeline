title: Amazon Buys Decart for $7.5B
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: Amazon is buying key assets of AI startup Decart, for a reported $7.5 billion.
  The deal brings Decart's optimization technology, which helps AI models run more
  efficiently on different hardware, along with its founding team, researchers and
  engineers, but not its Lucy or Oasis models, according to Tech Times. Webrazzi reports
  the aim is to make Amazon's own Trainium chips a stronger alternative to Nvidia,
  as Amazon prepares to offer them to customers. For Gulf companies and governments
  building AI capacity, more choice beyond Nvidia hardware could reshape how they
  plan their compute.
