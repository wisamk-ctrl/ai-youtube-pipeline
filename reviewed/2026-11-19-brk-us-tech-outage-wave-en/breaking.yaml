title: The U.S. Tech Outage Wave
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: 'A week of tech outages rattled the U.S. government and private sector.


  Foreign Policy reports that a global Microsoft outage, a rare nationwide FAA ground
  stop, brief disruptions at Chase Bank, Bank of America and Apple, and downed internal
  NSA systems all hit in quick succession. There is currently no evidence the incidents
  were cyberattacks or that they were linked. Microsoft''s Charles Lamanna pointed
  to a latent bug, a surge in load and reduced server capacity.


  For the Gulf, it is a reminder to watch how heavily critical public and business
  services rely on a small number of shared platforms.'
