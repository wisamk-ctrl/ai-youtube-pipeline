title: CIA System Hit by Breach
end_text: More on this in Sunday's episode
outro: assets/brand/shorts_outro_breaking_en.wav
linkedin: A breach has hit an analysis system used by the CIA. The New York Times
  reports that unclassified information on an open source intelligence system was
  exposed, and sources say the issue has been resolved. It is not clear what was compromised
  or who was responsible, and the incident follows a recent hack of the FBI's national
  crime database and system failures at Apple, JP Morgan Chase and Microsoft. Director
  of National Intelligence Jay Clayton links the outages to the rush to patch systems
  ahead of hackers armed with AI tools. For Gulf governments and businesses, it is
  a reminder that the speed of security upgrades now matters as much as their scope.
