name: words
# Word-by-word times of a week's own-voice recording (reviewed/<week>/narration.*), printed in the
# log, so a stumble the cleaner missed can be cut with a `cut:` span in voice.yaml (recording time).
on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week folder, e.g. 2026-W45"
        required: true
      model:
        description: "Whisper model"
        default: "large-v3-turbo"

permissions:
  contents: read

jobs:
  words:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q "faster-whisper>=1.2" "av>=15,<19"
      - name: Transcribe with word times
        env:
          WEEK: ${{ inputs.week }}
          MODEL: ${{ inputs.model }}
        run: |
          f=$(ls reviewed/"$WEEK"/narration.* | head -n1)
          python - "$f" <<'PY'
          import os, sys
          from faster_whisper import WhisperModel
          m = WhisperModel(os.environ["MODEL"], device="cpu", compute_type="int8")
          segs, _ = m.transcribe(sys.argv[1], language="ar", word_timestamps=True, vad_filter=False)
          for s in segs:
              for w in s.words or []:
                  print(f"W {w.start // 60:.0f}:{w.start % 60:05.2f} {w.end // 60:.0f}:{w.end % 60:05.2f} {w.word.strip()}", flush=True)
          PY
