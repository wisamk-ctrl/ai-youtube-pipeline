name: youtube-partnerships
# Adds "Partnerships: <publish.partnerships_email>" to every existing video's description (scripts/youtube_partnerships.py).
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preview, apply]
        default: preview
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -q -r requirements.lock
      - env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/youtube_partnerships.py ${{ inputs.mode == 'apply' && 'apply' || '' }}
