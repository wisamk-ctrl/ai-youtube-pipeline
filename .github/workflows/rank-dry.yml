name: rank-dry
# A ranking dry run on the news watch's last seven days (scripts/rank_dry.py): prints the judged, joined and
# slotted stories to the run summary. Nothing is saved and no issue is opened.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -q -r requirements.lock
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          python scripts/rank_dry.py | tee -a "$GITHUB_STEP_SUMMARY"
