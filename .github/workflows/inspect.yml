name: inspect
# Compares the week's transcript (what the presenter said) with the approved script and posts
# repeats, insertions, likely mispronunciations and missing words on the week's review issue.
on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week folder, e.g. 2026-W45"
        required: true

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml
      - name: Find the run that holds the week's artifact
        id: art
        uses: actions/github-script@v7
        with:
          script: |
            const name = `week-${{ inputs.week }}`;
            const { data } = await github.rest.actions.listArtifactsForRepo({ owner: context.repo.owner, repo: context.repo.repo, name, per_page: 20 });
            const live = data.artifacts.filter(a => !a.expired).sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
            if (!live.length) core.setFailed(`No artifact named ${name}`);
            else core.setOutput('run_id', String(live[0].workflow_run.id));
      - uses: actions/download-artifact@v4
        with:
          name: week-${{ inputs.week }}
          path: output/
          run-id: ${{ steps.art.outputs.run_id }}
          github-token: ${{ github.token }}
      - run: python scripts/transcript_report.py "output/${{ inputs.week }}" | tee report.md
      - uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('report.md', 'utf8').slice(0, 60000);
            const issues = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, labels: 'script-review', state: 'open', per_page: 50 });
            const issue = issues.data.find(i => i.title.includes(`(${{ inputs.week }})`));
            if (issue) await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body });
