name: explainer-scripts
# Writes the scripts of an explainer series from its research (pipeline/explainer_episode.py) and commits them for the
# founder's review. Renders and publishes nothing.
on:
  workflow_dispatch:
    inputs:
      series:
        description: "series folder"
        default: explainers/series-2-ai-in-the-gulf
      slugs:
        description: "episode slugs, space separated (empty = all)"
        default: ""
permissions:
  contents: write
  issues: write
concurrency:
  group: explainer-scripts
  cancel-in-progress: false
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SERIES: ${{ inputs.series }}
      SLUGS: ${{ inputs.slugs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -q -r requirements.lock
      - name: Write the scripts
        run: |
          set -o pipefail
          python -m pipeline.explainer_episode "$SERIES" $SLUGS | tee summary.txt
      - name: Save them for review
        if: always()
        run: |
          git config user.name "weekly-roundup[bot]" && git config user.email "bot@users.noreply.github.com"
          git add "$SERIES"
          git diff --cached --quiet && exit 0
          git commit -q -m "explainers: scripts for review ($SERIES)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          {
            echo "**Explainer scripts ready to review** ($SERIES)"; echo
            echo '```'; cat summary.txt; echo '```'; echo
            echo "Each episode folder has script.md, checks.md, source_map.md and critique.json:"
            echo "https://github.com/${{ github.repository }}/tree/main/$SERIES"
          } > body.md
          gh issue create --repo "${{ github.repository }}" --title "Review: explainer scripts ($(basename "$SERIES"))" --body-file body.md
