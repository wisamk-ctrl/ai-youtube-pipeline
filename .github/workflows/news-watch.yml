name: news-watch
# Reads the news every six hours (scripts/news_watch.py): keeps what it finds for the week's episode and
# posts the big stories to the "News watch" issue. No Claude calls; founder 2026-11-17.
on:
  schedule:
    - cron: "37 */2 * * *"     # every two hours: breaking-news Shorts go out within a couple of hours (founder 2026-11-18)
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write             # starts the render of a drafted breaking Short

concurrency:
  group: news-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.lock
      - run: python scripts/news_watch.py
      - name: Keep what the watch found
        if: always()
        run: |
          git config user.name "weekly-roundup[bot]" && git config user.email "bot@users.noreply.github.com"
          git add data/news_watch.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "news watch: $(date -u +'%F %H:%M')"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: Draft a breaking Short from the strongest new story (founder 2026-11-18)
        id: brk
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/breaking.py | tee breaking.log; grep '^BREAKING=' breaking.log | tail -1 >> "$GITHUB_OUTPUT"
      - name: Save the draft and start its render
        if: steps.brk.outputs.BREAKING != ''
        env:
          WEEK: ${{ steps.brk.outputs.BREAKING }}
        run: |
          git config user.name "weekly-roundup[bot]" && git config user.email "bot@users.noreply.github.com"
          git add "reviewed/$WEEK" data/breaking.json
          git commit -q -m "breaking: $WEEK drafted"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          gh workflow run weekly.yml --repo "$GITHUB_REPOSITORY" --ref main -f phase=assemble -f week="$WEEK"
          python scripts/breaking_issue.py drafted "$WEEK"
      - name: Remember the stories already tried
        if: steps.brk.outputs.BREAKING == ''
        run: |
          git config user.name "weekly-roundup[bot]" && git config user.email "bot@users.noreply.github.com"
          git add data/breaking.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "breaking: stories tried $(date -u +'%F %H:%M')"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
