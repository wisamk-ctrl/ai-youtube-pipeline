name: health
# A silent failure must never look like a quiet day (scripts/health.py, pipeline/publish/health.py).
# Daily: do the sign-ins still reach the right accounts, is the posting queue clean, is the news watch finding
# items, has every scheduled job succeeded lately. And the moment an on-demand workflow fails: one line on the
# "Health: needs a look" issue. Scheduled workflows are covered by the daily "last success" check instead (listing
# them here would start this workflow hundreds of times a day). tests/test_health.py keeps both lists complete.
on:
  schedule:
    - cron: "7 3 * * *"        # daily 07:07 Gulf
  workflow_dispatch:
  workflow_run:
    workflows: [approve, brand, breaking-post, channel-trailer, connect, explainer, fetch, heygen-assets, heygen-cost, inspect, preview, publish-pack,
                radar-decide, rank-dry, sfx, story-decide, thumb-survey, video-check, voice-compare, voice-lab, words,
                youtube-check, youtube-delete, youtube-partnerships, youtube-short-links, pvc-samples, playlists, quota, explainer-scripts]
    types: [completed]

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: health-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  failed:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      FLOW: ${{ github.event.workflow_run.name }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - run: python scripts/health.py failed "$FLOW" "$RUN_URL"

  check:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}   # the API wallet's balance
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -q -r requirements.lock
      - run: python scripts/health.py check
      - name: Keep the record
        if: always()
        run: |
          git config user.name "weekly-roundup[bot]" && git config user.email "bot@users.noreply.github.com"
          git add data/health.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "health: daily check ($(date -u +%F))"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
