name: voice-compare
# One text read by several voice engines; the MP3s land on the previews branch under lab/compare/.
on:
  workflow_dispatch:
    inputs:
      text:
        description: "Text file in the repo"
        default: lab/ar_mix_w45_part1.txt
permissions:
  contents: write
concurrency:
  group: previews-branch
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q requests pyyaml
      - env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/voice_compare.py "${{ inputs.text }}" out/lab/compare
      - name: Push to the previews branch
        run: |
          git config user.name "weekly-roundup[bot]" && git config user.email "bot@users.noreply.github.com"
          git fetch -q origin previews && git checkout -q -B previews origin/previews
          mkdir -p lab/compare && cp out/lab/compare/* lab/compare/
          git add lab/compare && git commit -q -m "voice compare $(date -u +%FT%H:%MZ)" && git push -q origin previews
