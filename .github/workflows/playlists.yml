name: playlists
# Puts every public video already on the channel into its topic playlists (scripts/playlists_backfill.py).
# New videos are placed automatically: Shorts at upload, episodes at release.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preview, apply]
        default: preview
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -q -r requirements.lock
      - env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/playlists_backfill.py ${{ inputs.mode == 'apply' && 'apply' || '' }}
