name: release
# Makes a gated episode public once YouTube shows each chapter with its own picture (scripts/release.py).
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write      # a released episode starts its LinkedIn/Facebook post (weekly.yml phase announce)

concurrency:
  group: release-queue
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Anything waiting?
        id: q
        run: |
          python3 -c "import json,pathlib;p=pathlib.Path('data/releases.json');q=json.loads(p.read_text()) if p.exists() else [];print('run='+('true' if any(e.get('status')=='waiting' for e in q) else 'false'))" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        if: steps.q.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - if: steps.q.outputs.run == 'true'
        run: pip install -q -r requirements.lock
      - if: steps.q.outputs.run == 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py
      - name: Save the release queue
        if: always() && steps.q.outputs.run == 'true'
        run: |
          git config user.name "weekly-roundup[bot]" && git config user.email "bot@users.noreply.github.com"
          git add data/releases.json; git diff --cached --quiet && exit 0
          git commit -q -m "release: queue update ($(date -u +%FT%H:%MZ))"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
