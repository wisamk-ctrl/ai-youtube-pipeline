name: publish-pack
# One download with everything for a hand upload (YouTube Studio, Instagram, TikTok): the 4K video,
# thumbnail, captions, youtube.txt (title, description, tags, settings) and the vertical clips with
# their captions. Download it from this run's page → Artifacts → publish-pack-<week>.
on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week folder, e.g. 2026-W45-en"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -q -r requirements.lock
      - name: Find the week's artifact
        id: art
        uses: actions/github-script@v7
        with:
          script: |
            let live = [];
            for (const name of [`week-${{ inputs.week }}`, `partial-week-${{ inputs.week }}`]) {
              const { data } = await github.rest.actions.listArtifactsForRepo({ owner: context.repo.owner, repo: context.repo.repo, name, per_page: 20 });
              live = live.concat(data.artifacts.filter(a => !a.expired));
            }
            live.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
            if (!live.length) core.setFailed(`No artifact for week ${{ inputs.week }}`);
            else { core.setOutput('run_id', String(live[0].workflow_run.id)); core.setOutput('name', live[0].name); }
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          path: output/
          run-id: ${{ steps.art.outputs.run_id }}
          github-token: ${{ github.token }}
      - run: python scripts/publish_pack.py "output/${{ inputs.week }}" "pack/${{ inputs.week }}" && du -sh pack/*
      - uses: actions/upload-artifact@v4
        with:
          name: publish-pack-${{ inputs.week }}
          path: pack/
          retention-days: 30
          compression-level: 0     # mp4s do not compress; zipping them only costs time
