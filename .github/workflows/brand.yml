name: brand
# Put the agreed artwork (assets/brand/) on the channels an app is allowed to change.
# YouTube: the banner. Profile pictures and the other platforms' artwork are manual (no API).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  youtube-banner:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - run: python scripts/brand_youtube.py
