name: breaking-post
# The founder's OK on the "Breaking Shorts" issue: a comment `post <week>` publishes that Short to YouTube, TikTok
# and LinkedIn (scripts/breaking_post.py + scripts/social.py). Only the repository owner's comment counts.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: social-queue
  cancel-in-progress: false

jobs:
  post:
    if: >-
      github.event.issue.title == 'Breaking Shorts' &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, 'post ')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
      SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Which Short?
        id: w
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          w=$(printf '%s' "$BODY" | head -n1 | sed -E 's/^post[[:space:]]+//; s/[^A-Za-z0-9._-].*$//')
          if [ ! -f "reviewed/$w/breaking.yaml" ]; then echo "No breaking Short named '$w'"; exit 1; fi
          echo "week=$w" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -q -r requirements.lock
      - name: Find the Short's artifact
        id: art
        uses: actions/github-script@v7
        with:
          script: |
            const name = `week-${{ steps.w.outputs.week }}`;
            const { data } = await github.rest.actions.listArtifactsForRepo({ owner: context.repo.owner, repo: context.repo.repo, name, per_page: 20 });
            const live = data.artifacts.filter(a => !a.expired).sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
            if (!live.length) core.setFailed(`No artifact ${name}: has the render finished?`); else core.setOutput('run_id', String(live[0].workflow_run.id));
      - uses: actions/download-artifact@v4
        with:
          name: week-${{ steps.w.outputs.week }}
          path: output/
          run-id: ${{ steps.art.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Plan, approve, post
        id: post
        env:
          WEEK: ${{ steps.w.outputs.week }}
        run: |
          python scripts/social.py plan "$WEEK"
          python scripts/breaking_post.py "$WEEK"
          python scripts/social.py post --id "$WEEK#1" | tee posted.log
      - name: Save the queue
        if: always()
        run: |
          git config user.name "weekly-roundup[bot]" && git config user.email "bot@users.noreply.github.com"
          git add data/social_queue.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "social: breaking ${{ steps.w.outputs.week }} posted"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: Report on the issue
        if: always() && steps.w.outputs.week != ''
        env:
          WEEK: ${{ steps.w.outputs.week }}
        run: |
          r=$(python3 -c "import json;[print(f'- {p}: {r.get(\"status\")} {r.get(\"url\",\"\")} {r.get(\"error\",\"\")[:200]}') for e in json.load(open('data/social_queue.json')) if e['week']=='$WEEK' for p,r in e['posts'].items()]")
          python scripts/breaking_issue.py posted "$WEEK" "$r"
