name: breaking-post
# The founder's OK on the "Breaking Shorts" issue: a comment `post <week>` publishes that Short to every connected
# platform in `social.platforms`, TikTok as a draft (scripts/breaking_post.py + scripts/social.py). Only the repository owner's comment counts.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:           # the render itself, for a Short the auto-post test lets through (scripts/breaking_auto.py)
    inputs:
      week:
        description: "breaking Short to post, e.g. 2026-11-25-brk-x-en"
        required: true

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: social-queue
  cancel-in-progress: false

jobs:
  post:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.title == 'Breaking Shorts' &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, 'post ')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}   # Instagram and the Facebook Page through Buffer
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}   # Instagram and the Facebook Page through Composio
      COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
      SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Which Short?
        id: w
        env:
          BODY: ${{ github.event.comment.body || format('post {0}', inputs.week) }}
        run: |
          w=$(printf '%s' "$BODY" | head -n1 | sed -E 's/^post[[:space:]]+//; s/[^A-Za-z0-9._-].*$//')
          if [ ! -f "reviewed/$w/breaking.yaml" ]; then echo "No breaking Short named '$w'"; exit 1; fi
          echo "week=$w" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -q -r requirements.lock
      - name: Find the Short's artifact
        id: art
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const name = `week-${{ steps.w.outputs.week }}`;
            const { data } = await github.rest.actions.listArtifactsForRepo({ owner: context.repo.owner, repo: context.repo.repo, name, per_page: 20 });
            const live = data.artifacts.filter(a => !a.expired).sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
            if (!live.length) core.setFailed(`No artifact ${name}: has the render finished?`); else core.setOutput('run_id', String(live[0].workflow_run.id));
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: week-${{ steps.w.outputs.week }}
          path: output/
          run-id: ${{ steps.art.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Plan, approve, post
        id: post
        env:
          WEEK: ${{ steps.w.outputs.week }}
        run: |
          python scripts/social.py plan "$WEEK"
          python scripts/breaking_post.py "$WEEK"
          python scripts/social.py post --id "$WEEK#1" | tee posted.log
      - name: Save the queue
        if: always()
        run: |
          bash scripts/save_queue.sh "social: breaking ${{ steps.w.outputs.week }} posted"
      - name: Report on the issue
        if: always() && steps.w.outputs.week != ''
        env:
          WEEK: ${{ steps.w.outputs.week }}
        run: |
          r=$(python3 -c "import json;[print(f'- {p}: {r.get(\"status\")} {r.get(\"url\",\"\")} {r.get(\"error\",\"\")[:200]}' + (chr(10) + chr(10) + r['note'] + chr(10) if r.get('note') else '')) for e in json.load(open('data/social_queue.json')) if e['week']=='$WEEK' for p,r in e['posts'].items()]")
          python scripts/breaking_issue.py posted "$WEEK" "$r"
