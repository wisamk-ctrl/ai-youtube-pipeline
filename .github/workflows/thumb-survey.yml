name: thumb-survey
# The tracked channels' latest thumbnails as contact sheets on the `previews` branch (thumbs/),
# a design reference for our own thumbnail. The session that drives the pipeline cannot reach YouTube.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: previews-branch
  cancel-in-progress: false

jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pyyaml && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/thumb_survey.py out/thumbs 4 && ls -la out/thumbs
      - name: Push to the previews branch
        run: |
          mkdir -p branch && cd branch
          git init -q -b previews
          git config user.name "weekly-roundup[bot]" && git config user.email "bot@users.noreply.github.com"
          git fetch -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" previews 2>/dev/null && git checkout -q FETCH_HEAD -- . 2>/dev/null || true
          rm -rf thumbs && cp -rf ../out/thumbs .
          git add -A && git commit -q -m "thumb survey ($(date -u +%FT%H:%MZ))"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:previews
