name: approve
# The founder's replies on a weekly "Review: … (<week>)" issue drive the chain (founder 2026-11-19):
#   approve  → English version → voice, render, Shorts → previews + a comment asking to publish
#   publish  → upload private; public at the Sunday slot. The reply says where the episode and the Shorts go,
#              per platform, from the code (scripts/release_plan.py), so it cannot name a platform that is skipped.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  act:
    if: >-
      startsWith(github.event.issue.title, 'Review:') &&
      github.event.comment.user.login == github.repository_owner &&
      (startsWith(github.event.comment.body, 'approve') || startsWith(github.event.comment.body, 'publish'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: ${{ github.event.issue.title }}
      BODY: ${{ github.event.comment.body }}
      NUM: ${{ github.event.issue.number }}
      # Which secrets are set, as flags: the reply says what is connected. No secret value reaches this job.
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY != '' && '1' || '' }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY != '' && '1' || '' }}
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY != '' && '1' || '' }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID != '' && '1' || '' }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN != '' && '1' || '' }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID != '' && '1' || '' }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET != '' && '1' || '' }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN != '' && '1' || '' }}
      LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN != '' && '1' || '' }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY != '' && '1' || '' }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET != '' && '1' || '' }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN != '' && '1' || '' }}
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE != '' && '1' || '' }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN != '' && '1' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Start the next step
        run: |
          week=$(printf '%s' "$TITLE" | sed -nE 's/.*\(([0-9]{4}-W[0-9]{2}[A-Za-z0-9-]*)\)[[:space:]]*$/\1/p')
          [ -n "$week" ] || { echo "No week in the issue title"; exit 1; }
          cmd=$(printf '%s' "$BODY" | head -n1 | awk '{print $1}')
          en="${week%-en}-en"
          if [ "$cmd" = approve ]; then
            if [ "$week" = "$en" ]; then
              gh workflow run weekly.yml --repo "$GITHUB_REPOSITORY" --ref main -f phase=assemble -f week="$en" -f chain=true
            else
              gh workflow run weekly.yml --repo "$GITHUB_REPOSITORY" --ref main -f phase=translate -f week="$week" -f chain=true
            fi
            msg="Approved. Making the English version, then voice, render and Shorts. I'll post the preview here (about 2 to 3 hours)."
          else
            gh workflow run weekly.yml --repo "$GITHUB_REPOSITORY" --ref main -f phase=publish -f week="$en"
            # The publish job is already started above: a failure to build this message never holds it back.
            msg=$(pip install -q "$(grep -i '^pyyaml==' requirements.lock)" >/dev/null 2>&1; python3 scripts/release_plan.py "$en") \
              || msg="Publishing \`$en\`. The per-platform summary could not be built: see this run's log."
          fi
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$msg"
