name: approve
# The founder's replies on a weekly "Review: … (<week>)" issue drive the chain (founder 2026-11-19):
#   approve  → English version → voice, render, Shorts → previews + a comment asking to publish
#   publish  → upload unlisted; public at the Sunday slot; LinkedIn and Facebook when public
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  act:
    if: >-
      startsWith(github.event.issue.title, 'Review:') &&
      github.event.comment.user.login == github.repository_owner &&
      (startsWith(github.event.comment.body, 'approve') || startsWith(github.event.comment.body, 'publish'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: ${{ github.event.issue.title }}
      BODY: ${{ github.event.comment.body }}
      NUM: ${{ github.event.issue.number }}
    steps:
      - name: Start the next step
        run: |
          week=$(printf '%s' "$TITLE" | sed -nE 's/.*\(([0-9]{4}-W[0-9]{2}[A-Za-z0-9-]*)\)[[:space:]]*$/\1/p')
          [ -n "$week" ] || { echo "No week in the issue title"; exit 1; }
          cmd=$(printf '%s' "$BODY" | head -n1 | awk '{print $1}')
          en="${week%-en}-en"
          if [ "$cmd" = approve ]; then
            if [ "$week" = "$en" ]; then
              gh workflow run weekly.yml --repo "$GITHUB_REPOSITORY" --ref main -f phase=assemble -f week="$en" -f chain=true
            else
              gh workflow run weekly.yml --repo "$GITHUB_REPOSITORY" --ref main -f phase=translate -f week="$week" -f chain=true
            fi
            msg="Approved. Making the English version, then voice, render and Shorts. I'll post the preview here (about 2 to 3 hours)."
          else
            gh workflow run weekly.yml --repo "$GITHUB_REPOSITORY" --ref main -f phase=publish -f week="$en"
            msg="Publishing \`$en\`: uploading unlisted now, public at the Sunday 17:00 Gulf slot. LinkedIn and Facebook follow when it is public."
          fi
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$msg"
