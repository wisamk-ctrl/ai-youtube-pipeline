name: connect
# Connect the show's YouTube / Instagram / TikTok accounts (docs/SOCIAL.md).
#   1. Run with platform = links → the sign-in links appear on the "Connect accounts" issue.
#   2. Click a link, allow, copy the address your browser lands on.
#   3. Run with platform = youtube | instagram | tiktok and paste that address as `code`.
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [links, check, youtube, instagram, facebook, tiktok, linkedin]
        default: links
      code:
        description: "The whole address the sign-in ended on (or just its code). Single-use, expires in minutes."
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  connect:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
      INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
      META_APP_ID: ${{ secrets.META_APP_ID }}               # Facebook Page (Meta app)
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
      LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
      SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
      SOCIAL_REDIRECT_URI: ${{ vars.SOCIAL_REDIRECT_URI }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Sign-in links → the "Connect accounts" issue
        if: inputs.platform == 'links'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/connect.py links > links.md
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Connect accounts in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --body-file links.md; else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Connect accounts" --body-file links.md; fi
          echo "Links are on the Connect accounts issue: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues"
      - name: Which accounts are connected
        if: inputs.platform == 'check'
        env:
          GH_TOKEN: ${{ github.token }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          python scripts/connect.py check | tee check.md
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Connect accounts in:title" --json number -q '.[0].number')
          [ -n "$n" ] && gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file check.md || true
      - name: Exchange the code and store the token
        if: inputs.platform != 'links' && inputs.platform != 'check'
        env:
          CODE: ${{ inputs.code }}
        run: python scripts/connect.py exchange "${{ inputs.platform }}" "$CODE"
