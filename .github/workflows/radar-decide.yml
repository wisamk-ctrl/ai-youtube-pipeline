# Decide on radar candidates from a comment on the weekly review issue:
#
#   /promote Reflection AI --track models --group us --ar ريفلكشن --alias Beam --hf reflectionai
#   /ignore Some Startup
#
# promote → opens a pull request that adds the name to config/watchlist.yaml (you merge it)
# ignore  → commits the status straight to data/radar_state.json
# Only the repository owner / collaborators can trigger it.

name: radar-decide

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  decide:
    if: >
      startsWith(github.event.comment.body, '/promote ') || startsWith(github.event.comment.body, '/ignore ')
    runs-on: ubuntu-latest
    steps:
      - name: Check the commenter may decide
        if: ${{ !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) }}
        run: echo "::error::only the repository owner or collaborators can promote/ignore" && exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.lock }
      - run: pip install -r requirements.lock
      - name: Apply the decision
        # The comment is untrusted text: it reaches Python through the environment, is split with
        # shlex there (never eval'd), and the outputs come back through GITHUB_OUTPUT heredocs.
        id: apply
        env:
          BODY: ${{ github.event.comment.body }}
        run: python scripts/radar_comment.py
      - name: Commit (ignore) or open a PR (promote)
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.apply.outputs.kind }}
          NAME: ${{ steps.apply.outputs.name }}
          BR: ${{ steps.apply.outputs.branch }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          git config user.name "weekly-roundup[bot]" && git config user.email "bot@users.noreply.github.com"
          if [ "$KIND" = "ignore" ]; then
            git add data/radar_state.json && git commit -m "radar: ignore $NAME" && git push
          else
            git checkout -b "$BR"
            git add config/watchlist.yaml data/radar_state.json
            git commit -m "watchlist: promote $NAME"
            git push -u origin "$BR"
            gh pr create --title "Watchlist: add $NAME" \
              --body "Promoted from the radar via #$ISSUE. Review the aliases/Arabic name, then merge." \
              --base main --head "$BR"
          fi
      - name: Reply on the issue
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.apply.outputs.result }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: `✅ ${process.env.RESULT}` });
