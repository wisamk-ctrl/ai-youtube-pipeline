name: explainer
# Explainer Shorts from the approved ranking (pipeline/explainer.py, founder 2026-11-23). Started by story-decide
# when the founder approves the week's ranking; each draft is rendered like a breaking Short and waits for
# `post <id>` on the "Breaking Shorts" issue. dry: prints the scripts from a ranking built now, keeps nothing.
on:
  workflow_dispatch:
    inputs:
      week:
        description: "the ranked week, e.g. 2026-W48 (ignored when dry)"
        default: ""
      dry:
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: explainer
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      WEEK: ${{ inputs.week }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.lock }
      - run: pip install -q -r requirements.lock
      - name: Dry run (prints only)
        if: inputs.dry
        run: |
          set -o pipefail
          python scripts/explainer.py --dry | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Draft the explainer Shorts
        id: exp
        if: ${{ !inputs.dry }}
        run: |
          set -o pipefail
          python scripts/explainer.py "$WEEK" | tee explainer.log
          grep '^EXPLAINERS=' explainer.log | tail -1 >> "$GITHUB_OUTPUT"
      - name: Save the drafts and start their renders
        if: ${{ !inputs.dry }}
        env:
          MADE: ${{ steps.exp.outputs.EXPLAINERS }}
        run: |
          git config user.name "weekly-roundup[bot]" && git config user.email "bot@users.noreply.github.com"
          git add data/explainer.json
          for w in $MADE; do git add "reviewed/$w"; done
          git diff --cached --quiet && exit 0
          git commit -q -m "explainer: ${MADE:-none} drafted from $WEEK"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          for w in $MADE; do
            gh workflow run weekly.yml --repo "$GITHUB_REPOSITORY" --ref main -f phase=assemble -f week="$w"
            python scripts/breaking_issue.py drafted "$w"
          done
