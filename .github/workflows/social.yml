name: social
# Shorts / Reels / TikTok on the platforms' own APIs (pipeline/publish/social.py, docs/SOCIAL.md).
# Hourly: post every approved entry of data/social_queue.json whose time has come.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [post, plan, approve, status]
        default: post
      week:
        description: "plan / approve: the week folder, e.g. 2026-W45-en"
        default: ""
      id:
        description: "post: only this entry, e.g. 2026-W45-en#1 (it must be approved and due)"
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: social-queue
  cancel-in-progress: false

jobs:
  social:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Anything to do?
        id: due
        run: |
          a="${{ inputs.action || 'post' }}"
          if [ "$a" = post ] && [ -z "${{ inputs.id }}" ]; then
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, datetime as d
          q = pathlib.Path("data/social_queue.json")
          now = d.datetime.now(d.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          due = [e for e in (json.loads(q.read_text()) if q.exists() else [])
                 if e.get("approved") and e["due"] <= now and any(r.get("status") not in ("posted", "skipped") for r in e["posts"].values())]
          print(f"run={'true' if due else 'false'}")
          PY
          else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.due.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - if: steps.due.outputs.run == 'true'
        run: pip install -q -r requirements.lock
      - name: Find the week's artifact (plan)
        if: inputs.action == 'plan'
        id: art
        uses: actions/github-script@v7
        with:
          script: |
            const name = `week-${{ inputs.week }}`;
            const { data } = await github.rest.actions.listArtifactsForRepo({ owner: context.repo.owner, repo: context.repo.repo, name, per_page: 20 });
            const live = data.artifacts.filter(a => !a.expired).sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
            if (!live.length) core.setFailed(`No artifact ${name}`); else core.setOutput('run_id', String(live[0].workflow_run.id));
      - if: inputs.action == 'plan'
        uses: actions/download-artifact@v4
        with:
          name: week-${{ inputs.week }}
          path: output/
          run-id: ${{ steps.art.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Run
        if: steps.due.outputs.run == 'true'
        env:
          ACTION: ${{ inputs.action || 'post' }}
          WEEK: ${{ inputs.week }}
          ONLY: ${{ inputs.id }}
        run: |
          case "$ACTION" in
            post) python scripts/social.py post ${ONLY:+--id "$ONLY"} ;;
            *) python scripts/social.py "$ACTION" $WEEK ;;
          esac
      - name: Save the queue
        if: always() && steps.due.outputs.run == 'true'
        run: |
          git config user.name "weekly-roundup[bot]" && git config user.email "bot@users.noreply.github.com"
          git add data/social_queue.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "social: queue update ($(date -u +%FT%H:%MZ))"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
