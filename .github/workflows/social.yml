name: social
# Shorts / Reels / TikTok on the platforms' own APIs (pipeline/publish/social.py, docs/SOCIAL.md).
# Hourly: post every approved entry of data/social_queue.json whose time has come.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [post, plan, replan, approve, status]
        default: post
      week:
        description: "plan / replan / approve: the week folder, e.g. 2026-W45-en"
        default: ""
      id:
        description: "post: only this entry, e.g. 2026-W45-en#1 (it must be approved and due)"
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: social-queue
  cancel-in-progress: false

jobs:
  social:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Anything to do?
        id: due
        run: |
          a="${{ inputs.action || 'post' }}"
          if [ "$a" = post ] && [ -z "${{ inputs.id }}" ]; then
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, datetime as d
          q = pathlib.Path("data/social_queue.json")
          now = d.datetime.now(d.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          due = [e for e in (json.loads(q.read_text()) if q.exists() else [])
                 if e.get("approved") and e["due"] <= now and any(r.get("status") not in ("posted", "skipped", "unconfirmed") for r in e["posts"].values())]
          print(f"run={'true' if due else 'false'}")
          PY
          else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        if: steps.due.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - if: steps.due.outputs.run == 'true'
        run: pip install -q -r requirements.lock
      - name: Find the week's artifact (plan)
        if: inputs.action == 'plan' || inputs.action == 'replan'
        id: art
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const name = `week-${{ inputs.week }}`;
            const { data } = await github.rest.actions.listArtifactsForRepo({ owner: context.repo.owner, repo: context.repo.repo, name, per_page: 20 });
            const live = data.artifacts.filter(a => !a.expired).sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
            if (!live.length) core.setFailed(`No artifact ${name}`); else core.setOutput('run_id', String(live[0].workflow_run.id));
      - if: inputs.action == 'plan' || inputs.action == 'replan'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: week-${{ inputs.week }}
          path: output/
          run-id: ${{ steps.art.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Run
        if: steps.due.outputs.run == 'true'
        env:
          ACTION: ${{ inputs.action || 'post' }}
          WEEK: ${{ inputs.week }}
          ONLY: ${{ inputs.id }}
        run: |
          case "$ACTION" in
            post) python scripts/social.py post ${ONLY:+--id "$ONLY"} ;;
            *) python scripts/social.py "$ACTION" $WEEK ;;
          esac
          # Approving a week also uploads its episode (scheduled, see publish: in settings.yaml); the upload
          # refuses to run twice for one week.
          if [ "$ACTION" = approve ]; then
            gh workflow run weekly.yml --repo "$GITHUB_REPOSITORY" --ref main -f phase=publish -f week="$WEEK"
            echo "Episode upload started for $WEEK"
          fi
      - name: Save the queue
        if: always() && steps.due.outputs.run == 'true'
        run: |
          bash scripts/save_queue.sh "social: queue update ($(date -u +%FT%H:%MZ))"
