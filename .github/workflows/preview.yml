name: preview
# Makes a watchable copy of a week's video: picks the most finished file in the week's artifact
# (final_subtitled → with_cards → talking_head), transcodes it to 1080p H.264, and force-pushes it
# to the orphan branch `previews` (one commit, so old previews never bloat the repo history).
on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week folder whose artifact holds the video, e.g. voicetest or 2026-W43 (also the preview's file name)"
        required: true
      what:
        description: "text (the week's script, voice pack and source map, as <week>-files/), video (the most finished cut) or voice (the own-voice check: cleaned read + cut report, from phase voicecheck)"
        type: choice
        options: [video, voice, text, all]   # all = the video and the files, in one run
        default: video
      video_url:
        description: "Optional: preview this video instead of the week's artifact (a direct MP4 link, e.g. from HeyGen)"
        default: ""

permissions:
  contents: write
  actions: read

# Every preview force-pushes the one `previews` branch after fetching it: two at once (even for
# different weeks) would drop one week's file. So one group for all previews; queue, never cancel.
concurrency:
  group: previews-branch
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Find the run that holds the week's artifact
        if: inputs.video_url == ''
        id: art
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            // The newest of week-<week> and partial-week-<week>: a run whose finished edit failed only at
            // the upload (GitHub's artifact service erroring, 2026-11-11) still saved it as partial-week-.
            let live = [];
            for (const name of [`week-${{ inputs.week }}`, `partial-week-${{ inputs.week }}`]) {
              const { data } = await github.rest.actions.listArtifactsForRepo({ owner: context.repo.owner, repo: context.repo.repo, name, per_page: 20 });
              live = live.concat(data.artifacts.filter(a => !a.expired));
            }
            live.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
            if (!live.length) core.setFailed(`No artifact for week ${{ inputs.week }}`);
            else { core.info(`Using ${live[0].name} from run ${live[0].workflow_run.id}`); core.setOutput('run_id', String(live[0].workflow_run.id)); core.setOutput('name', live[0].name); }
      - name: Download the given video
        if: inputs.video_url != ''
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: mkdir -p "art/${{ inputs.week }}" && curl -sSfL -o "art/${{ inputs.week }}/talking_head.mp4" "$VIDEO_URL"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        if: inputs.video_url == ''
        with:
          name: ${{ steps.art.outputs.name }}
          path: art/
          run-id: ${{ steps.art.outputs.run_id }}
          github-token: ${{ github.token }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Transcode to a 1080p preview
        run: |
          d="art/${{ inputs.week }}"
          mkdir -p out
          if [ "${{ inputs.what }}" = "text" ] || [ "${{ inputs.what }}" = "all" ]; then   # the session that drives the pipeline cannot download artifacts
            mkdir -p "out/${{ inputs.week }}-files"
            for f in items.json script.md voice_pack.md voice_pack.json source_map.md plan.json critique.json shotlist.md cards.json subtitles.srt timeline.json credits.json stock_used.json thumbnail.png thumbnail_b.png; do
              [ -f "$d/$f" ] && cp "$d/$f" "out/${{ inputs.week }}-files/" || true
            done
            [ -d "$d/cards" ] && cp -r "$d/cards" "out/${{ inputs.week }}-files/cards" || true
            [ -f "$d/with_cards.mp4" ] && ffmpeg -hide_banner -loglevel error -y -ss 40 -t 12 -i "$d/with_cards.mp4" -vf scale=-2:540 -an "out/${{ inputs.week }}-files/with_cards_40s.mp4" || true
            for v in "$d"/*.mp4; do   # where does the picture stop? frames per 30 s of every stage
              echo "== $(basename "$v")"; ffprobe -v error -select_streams v:0 -show_entries packet=pts_time -of csv=p=0 "$v" | awk '{n[int($1/30)]++} END{for(i=0;i<20;i++) printf "%d ", n[i]; print ""}'
            done > "out/${{ inputs.week }}-files/frames.txt" 2>&1 || true
            for v in "$d"/shorts/short_*.mp4; do   # the week's Shorts, small enough to push
              [ -f "$v" ] && ffmpeg -hide_banner -loglevel error -y -i "$v" -vf scale=540:-2 -c:v libx264 -crf 27 -preset fast -c:a aac -b:a 96k "out/${{ inputs.week }}-files/$(basename "$v")" || true
            done
            [ -f "$d/shorts/shorts.json" ] && cp "$d/shorts/shorts.json" "out/${{ inputs.week }}-files/" || true
            ls -la "out/${{ inputs.week }}-files"
            [ "${{ inputs.what }}" = "all" ] || exit 0
          fi
          if [ "${{ inputs.what }}" = "voice" ]; then
            [ -f "$d/voice_check.mp3" ] || { echo "::error::no voice_check.mp3 in $d (run phase voicecheck first)"; exit 1; }
            cp "$d/voice_check.mp3" "out/${{ inputs.week }}-voice.mp3"
            cp "$d/ownvoice.md" "out/${{ inputs.week }}-voice.md"
            [ -f "$d/voice_words.json" ] && cp "$d/voice_words.json" "out/${{ inputs.week }}-voice.words.json" || true
            cat "$d/ownvoice.md" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for f in final_subtitled.mp4 with_cards.mp4 talking_head.mp4; do [ -f "$d/$f" ] && src="$d/$f" && break; done
          [ -n "${src:-}" ] || { echo "::error::no video in $d"; ls -R art; exit 1; }
          echo "Source: $src"
          [ -f "$d/ownvoice.md" ] && { cat "$d/ownvoice.md"; cat "$d/ownvoice.md" >> "$GITHUB_STEP_SUMMARY"; } || true
          # Word times of the own-voice recording, for `cut:` spans in voice.yaml (recording time).
          [ -f "$d/assemble/heard.json" ] && python3 -c "
          import json, sys
          for e in json.load(open(sys.argv[1]))['entries'].values():
              print('WORDS', ' '.join(f'{a // 60:.0f}:{a % 60:04.1f}-{b % 60:04.1f}={w.strip()}' for a, b, w in e['words']))
          " "$d/assemble/heard.json" | fold -w 3000 || true
          mkdir -p out
          # GitHub refuses files over 100 MB: size the bitrate to the length so any episode lands under ~90 MB,
          # and drop to 720p when that bitrate would be too thin for 1080p.
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$src")
          kbps=$(python3 -c "print(max(400, min(4000, int(90*8*1000/float('$dur')) - 160)))")
          height=$([ "$kbps" -ge 1500 ] && echo 1080 || echo 720)
          echo "Preview: ${dur}s at ${kbps} kbps, ${height}p"
          ffmpeg -hide_banner -loglevel error -y -i "$src" -vf "scale=-2:${height}" -c:v libx264 -preset medium \
            -b:v "${kbps}k" -maxrate "$((kbps * 3 / 2))k" -bufsize "$((kbps * 2))k" \
            -c:a aac -b:a 128k -movflags +faststart "out/${{ inputs.week }}.mp4"
          ls -la out
      - name: Push to the previews branch
        run: |
          # Keep the other weeks' previews, then put the new file on top (never the other way round).
          mkdir -p branch && cd branch
          git init -q -b previews
          git config user.name "weekly-roundup[bot]" && git config user.email "bot@users.noreply.github.com"
          git fetch -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" previews 2>/dev/null && git checkout -q FETCH_HEAD -- . 2>/dev/null || true
          cp -rf ../out/* .
          git add -A && git commit -q -m "preview: ${{ inputs.week }} ($(date -u +%FT%H:%MZ)) from ${{ inputs.video_url != '' && 'a direct link' || format('run {0}', steps.art.outputs.run_id) }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:previews
