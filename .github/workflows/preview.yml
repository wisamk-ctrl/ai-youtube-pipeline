name: preview
# Makes a watchable copy of a week's video: picks the most finished file in the week's artifact
# (final_subtitled → with_cards → talking_head), transcodes it to 1080p H.264, and force-pushes it
# to the orphan branch `previews` (one commit, so old previews never bloat the repo history).
on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week folder whose artifact holds the video, e.g. voicetest or 2026-W43 (also the preview's file name)"
        required: true
      video_url:
        description: "Optional: preview this video instead of the week's artifact (a direct MP4 link, e.g. from HeyGen)"
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find the run that holds the week's artifact
        if: inputs.video_url == ''
        id: art
        uses: actions/github-script@v7
        with:
          script: |
            const name = `week-${{ inputs.week }}`;
            const { data } = await github.rest.actions.listArtifactsForRepo({ owner: context.repo.owner, repo: context.repo.repo, name, per_page: 20 });
            const live = data.artifacts.filter(a => !a.expired).sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
            if (!live.length) core.setFailed(`No artifact named ${name}`);
            else core.setOutput('run_id', String(live[0].workflow_run.id));
      - name: Download the given video
        if: inputs.video_url != ''
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: mkdir -p "art/${{ inputs.week }}" && curl -sSfL -o "art/${{ inputs.week }}/talking_head.mp4" "$VIDEO_URL"
      - uses: actions/download-artifact@v4
        if: inputs.video_url == ''
        with:
          name: week-${{ inputs.week }}
          path: art/
          run-id: ${{ steps.art.outputs.run_id }}
          github-token: ${{ github.token }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Transcode to a 1080p preview
        run: |
          d="art/${{ inputs.week }}"
          for f in final_subtitled.mp4 with_cards.mp4 talking_head.mp4; do [ -f "$d/$f" ] && src="$d/$f" && break; done
          [ -n "${src:-}" ] || { echo "::error::no video in $d"; ls -R art; exit 1; }
          echo "Source: $src"
          mkdir -p out
          # GitHub refuses files over 100 MB: size the bitrate to the length so any episode lands under ~90 MB,
          # and drop to 720p when that bitrate would be too thin for 1080p.
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$src")
          kbps=$(python3 -c "print(max(400, min(4000, int(90*8*1000/float('$dur')) - 160)))")
          height=$([ "$kbps" -ge 1500 ] && echo 1080 || echo 720)
          echo "Preview: ${dur}s at ${kbps} kbps, ${height}p"
          ffmpeg -hide_banner -loglevel error -y -i "$src" -vf "scale=-2:${height}" -c:v libx264 -preset medium \
            -b:v "${kbps}k" -maxrate "$((kbps * 3 / 2))k" -bufsize "$((kbps * 2))k" \
            -c:a aac -b:a 128k -movflags +faststart "out/${{ inputs.week }}.mp4"
          ls -la out
      - name: Push to the previews branch
        run: |
          # Keep the other weeks' previews, then put the new file on top (never the other way round).
          mkdir -p branch && cd branch
          git init -q -b previews
          git config user.name "weekly-roundup[bot]" && git config user.email "bot@users.noreply.github.com"
          git fetch -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" previews 2>/dev/null && git checkout -q FETCH_HEAD -- . 2>/dev/null || true
          cp -f "../out/${{ inputs.week }}.mp4" .
          git add -A && git commit -q -m "preview: ${{ inputs.week }} ($(date -u +%FT%H:%MZ)) from ${{ inputs.video_url != '' && 'a direct link' || format('run {0}', steps.art.outputs.run_id) }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:previews
