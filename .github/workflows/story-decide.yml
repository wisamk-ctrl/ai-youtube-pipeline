# The founder's decisions on the weekly "Ranking: <week>" issue (founder 2026-11-22: he approves the ranked
# list before the script is written):
#
#   /story 7 deep because the Jordan angle matters        (a number from the list, or an id; or quick | radar |
#                                                         short | drop | auto; several lines in one comment)
#   approve                                               → writes the script from the list as it stands
#
# The issue's body is replaced with the new list and the reply only says what moved.
# Every move is logged with its reason in data/ranking/<week>.json. Repository owner only, like approve.yml.

name: story-decide

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: story-decide-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  decide:
    if: >-
      startsWith(github.event.issue.title, 'Ranking:') &&
      github.event.comment.user.login == github.repository_owner &&
      (startsWith(github.event.comment.body, '/story') || startsWith(github.event.comment.body, 'approve'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.lock }
      - run: pip install -r requirements.lock
      - name: Apply the decision
        # The comment is untrusted text: it reaches Python through the environment and is matched with one
        # regular expression there (never eval'd); the outputs come back through GITHUB_OUTPUT heredocs.
        id: apply
        env:
          BODY: ${{ github.event.comment.body }}
          TITLE: ${{ github.event.issue.title }}
          ACTOR: ${{ github.event.comment.user.login }}
          ISSUE_BODY: ${{ runner.temp }}/ranking_issue.md
        run: python scripts/story_comment.py
      - name: Put the new list at the top of the issue
        # The reply below only says what moved; the issue's own body always holds the list as it stands.
        if: steps.apply.outputs.kind != 'error'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ runner.temp }}/ranking_issue.md
        run: gh issue edit "$NUM" --repo "$GITHUB_REPOSITORY" --body-file "$ISSUE_BODY"
      - name: Commit the decision
        if: steps.apply.outputs.kind != 'error'
        env:
          KIND: ${{ steps.apply.outputs.kind }}
          WEEK: ${{ steps.apply.outputs.week }}
        run: |
          git config user.name "weekly-roundup[bot]" && git config user.email "bot@users.noreply.github.com"
          git add data/ranking
          git diff --cached --quiet && exit 0
          git commit -q -m "ranking: $WEEK $KIND"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep $((i * 5)); done
          echo "::error::Could not push the decision"; exit 1
      - name: Write the script from the approved list
        if: steps.apply.outputs.kind == 'approve'
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK: ${{ steps.apply.outputs.week }}
        run: |
          gh workflow run weekly.yml --repo "$GITHUB_REPOSITORY" --ref main -f phase=script -f week="$WEEK"
          # The approved list's explainer Shorts are drafted alongside (.github/workflows/explainer.yml).
          gh workflow run explainer.yml --repo "$GITHUB_REPOSITORY" --ref main -f week="$WEEK" || echo "::warning::explainer Shorts not started"
      - name: Reply on the issue
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        env:
          RESULT: ${{ steps.apply.outputs.result }}
          STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.STATUS === 'success' && process.env.RESULT;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: ok ? process.env.RESULT : `The decision was not applied (run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).` });
