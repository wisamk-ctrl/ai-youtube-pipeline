name: youtube-check
# Checks the YouTube sign-in (GOOGLE_CLIENT_ID/SECRET + YOUTUBE_REFRESH_TOKEN): prints the channel the
# token uploads to and the scopes it carries. Read-only: uploads and changes nothing.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: previews-branch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth requests
      - env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys, requests
          for k in ("GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN"):
              print(f"{k}: {'set' if os.environ.get(k) else 'MISSING'}")
          if not all(os.environ.get(k) for k in ("GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN")):
              sys.exit("a secret is missing")
          r = requests.post("https://oauth2.googleapis.com/token", timeout=30, data={
              "client_id": os.environ["GOOGLE_CLIENT_ID"], "client_secret": os.environ["GOOGLE_CLIENT_SECRET"],
              "refresh_token": os.environ["YOUTUBE_REFRESH_TOKEN"], "grant_type": "refresh_token"})
          if r.status_code != 200:
              sys.exit(f"token refresh failed: HTTP {r.status_code} {r.json().get('error')}: {r.json().get('error_description')}")
          tok = r.json()
          print("scopes:", tok.get("scope"))
          info = requests.get("https://www.googleapis.com/youtube/v3/channels", timeout=30,
                              params={"part": "snippet,statistics", "mine": "true"},
                              headers={"Authorization": f"Bearer {tok['access_token']}"})
          print("channels.list:", info.status_code)
          for c in info.json().get("items", []):
              print("CHANNEL:", c["snippet"]["title"], "| id", c["id"], "| videos", c["statistics"].get("videoCount"),
                    "| subscribers", c["statistics"].get("subscriberCount"))
          if info.status_code != 200 or not info.json().get("items"):
              sys.exit(f"no channel: {info.text[:300]}")
          # The channel's videos (also the scheduled and private ones), newest first
          up = info.json()["items"][0]["id"]
          pl = requests.get("https://www.googleapis.com/youtube/v3/channels", timeout=30,
                            params={"part": "contentDetails", "mine": "true"},
                            headers={"Authorization": f"Bearer {tok['access_token']}"}).json()["items"][0]
          uploads = pl["contentDetails"]["relatedPlaylists"]["uploads"]
          items = requests.get("https://www.googleapis.com/youtube/v3/playlistItems", timeout=30,
                               params={"part": "contentDetails", "playlistId": uploads, "maxResults": 20},
                               headers={"Authorization": f"Bearer {tok['access_token']}"}).json().get("items", [])
          ids = ",".join(i["contentDetails"]["videoId"] for i in items)
          if ids:
              vids = requests.get("https://www.googleapis.com/youtube/v3/videos", timeout=30,
                                  params={"part": "snippet,status,contentDetails", "id": ids},
                                  headers={"Authorization": f"Bearer {tok['access_token']}"}).json().get("items", [])
              for v in vids:
                  st = v["status"]
                  print("VIDEO:", v["id"], "|", v["snippet"]["title"][:70], "|", st.get("privacyStatus"),
                        "| goes public", st.get("publishAt", "-"), "|", v["contentDetails"].get("duration"),
                        "| uploaded", v["snippet"].get("publishedAt"))
          else:
              print("VIDEO: none")
          # Backup of the channel's look and text (title, handle, description, keywords, picture, banner).
          import json, pathlib
          full = requests.get("https://www.googleapis.com/youtube/v3/channels", timeout=30,
                              params={"part": "snippet,brandingSettings", "mine": "true"},
                              headers={"Authorization": f"Bearer {tok['access_token']}"}).json()["items"][0]
          out = pathlib.Path("backup"); out.mkdir()
          (out / "channel.json").write_text(json.dumps(full, ensure_ascii=False, indent=2), encoding="utf-8")
          sn, br = full["snippet"], full.get("brandingSettings", {})
          print("HANDLE:", sn.get("customUrl"))
          print("DESCRIPTION:", (sn.get("description") or "")[:500].replace("\n", " / "))
          pic = (sn.get("thumbnails", {}).get("high") or sn.get("thumbnails", {}).get("default") or {}).get("url")
          ban = br.get("image", {}).get("bannerExternalUrl")
          for name, url in (("picture.jpg", pic), ("banner.jpg", ban + "=w2560" if ban else None)):
              print(name, "->", "saved" if url else "none")
              if url:
                  (out / name).write_bytes(requests.get(url, timeout=60).content)
          PY
      - name: Keep the backup on the previews branch (channel-backup/)
        run: |
          [ -d backup ] || exit 0
          mkdir -p branch && cd branch
          git init -q -b previews
          git config user.name "weekly-roundup[bot]" && git config user.email "bot@users.noreply.github.com"
          git fetch -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" previews 2>/dev/null && git checkout -q FETCH_HEAD -- . 2>/dev/null || true
          rm -rf channel-backup && cp -r ../backup channel-backup
          git add -A && git commit -q -m "channel backup ($(date -u +%FT%H:%MZ))" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:previews
