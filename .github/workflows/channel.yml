name: channel
# Never miss a week, and learn what works (scripts/channel.py).
on:
  schedule:
    - cron: "41 11 * * 6"     # Saturday 15:41 Gulf: did this week's script run succeed?
    - cron: "17 4 * * 0"      # Sunday 08:17 Gulf: is an episode going out today?
    - cron: "29 5 * * 1"      # Monday 09:29 Gulf: the weekly numbers
  workflow_dispatch:
    inputs:
      check:
        type: choice
        options: [report, watch-script, watch-publish]
        default: report

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      LINKEDIN_TOKEN_UNTIL: ${{ secrets.LINKEDIN_TOKEN_UNTIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Run the check
        run: |
          case "${{ github.event.schedule }}" in
            "41 11 * * 6") c=watch-script ;;
            "17 4 * * 0") c=watch-publish ;;
            "29 5 * * 1") c=report ;;
            *) c="${{ inputs.check }}" ;;
          esac
          python scripts/channel.py "$c"
      - name: Keep the numbers
        if: always()
        run: |
          git config user.name "weekly-roundup[bot]" && git config user.email "bot@users.noreply.github.com"
          git add data/channel_stats.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "channel: weekly numbers ($(date -u +%F))"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
