name: channel
# Never miss a week, and learn what works (scripts/channel.py).
on:
  schedule:
    - cron: "41 11 * * 5"     # Friday 15:41 Gulf: did this week's script run succeed? (script run moved to Friday)
    - cron: "17 4 * * 0"      # Sunday 08:17 Gulf: is an episode going out today?
    - cron: "29 5 * * 1"      # Monday 09:29 Gulf: the weekly numbers
    - cron: "47 * * * *"      # hourly: an episode or Short just went public → the WhatsApp kit (Channel + status)
    - cron: "23 2 * * *"      # daily 06:23 Gulf: channel integrity (renamed, new handle, unknown uploads; scripts/integrity.py)
    - cron: "53 */3 * * *"    # every 3 h: fresh dashboard files (data/dashboard), no issue (founder 2026-11-23)
  workflow_dispatch:
    inputs:
      check:
        type: choice
        options: [report, dashboard, watch-script, watch-publish, status-kit, integrity]
        default: report

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}      # integrity alerts by WhatsApp once CallMeBot is set up
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}     # reel views and likes (Instagram and Facebook post through it)
      COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      LINKEDIN_TOKEN_UNTIL: ${{ secrets.LINKEDIN_TOKEN_UNTIL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Run the check
        run: |
          case "${{ github.event.schedule }}" in
            "41 11 * * 5") c=watch-script ;;
            "17 4 * * 0") c=watch-publish ;;
            "29 5 * * 1") c=report ;;
            "47 * * * *") c=status-kit ;;
            "23 2 * * *") c=integrity ;;
            "53 */3 * * *") c=dashboard ;;
            *) c="${{ inputs.check }}" ;;
          esac
          if [ "$c" = integrity ]; then python scripts/integrity.py; else python scripts/channel.py "$c"; fi
      - name: Keep the numbers
        if: always()
        run: |
          git config user.name "weekly-roundup[bot]" && git config user.email "bot@users.noreply.github.com"
          git add data/channel_stats.json data/status_kits.json data/dashboard 2>/dev/null || true
          git add data/integrity.json 2>/dev/null || true      # apart: a missing file would make git add skip them all
          git diff --cached --quiet && exit 0
          git commit -q -m "channel: weekly numbers ($(date -u +%F))"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
